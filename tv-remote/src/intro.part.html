
<!-- intro: animated safety film shown when the app opens -->
<style>
#intro{position:fixed;inset:0;z-index:100;background:#0f1830;color:#fff;overflow:hidden;transition:opacity .5s}
#intro.out{opacity:0;pointer-events:none}
#introCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#introSkip{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top,0px));z-index:2;border:1px solid rgba(255,255,255,.5);background:rgba(15,24,48,.55);color:#fff;border-radius:999px;padding:7px 14px;font:500 13px/1 "IBM Plex Sans KR",system-ui,sans-serif;cursor:pointer}
#introGate{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:#fff;padding-inline:24px}
#introGate img{width:min(300px,80%);height:auto}
#introGate button{border:0;background:#ea002c;color:#fff;border-radius:999px;padding:14px 26px;font:700 16px/1 "IBM Plex Sans KR",system-ui,sans-serif;cursor:pointer;box-shadow:0 8px 24px rgba(234,0,44,.3)}
#introGate .later{background:transparent;color:#5d6874;box-shadow:none;font-weight:500;font-size:13px;padding:6px}
</style>
<div id="intro" hidden>
  <canvas id="introCanvas"></canvas>
  <button id="introSkip">건너뛰기 ›</button>
  <div id="introGate" hidden>
    <img id="introLogoImg" alt="홈앤서비스 SK브로드밴드" src="__LOGO__">
    <button id="introPlay">▶ 인트로 보기 (소리 켜짐)</button>
    <button class="later" id="introNo">바로 시작하기</button>
  </div>
</div>
<script>
(() => {
const TOTAL = 31;
const CUTS = [0, 2.5, 6, 9.5, 13, 16.5, 20, 23.5, 27];
const RED = "#ea002c", ORANGE = "#f47725", NAVY = "#0f1830";
const FONT = '"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const logo = document.getElementById("introLogoImg");
/* Optional photos per scene (scene index -> data URI), filled in by build_page.py from src/photos/. */
const PHOTOS = __PHOTOS__;
const photos = {};
Object.keys(PHOTOS).forEach(k => { const im = new Image(); im.src = PHOTOS[k]; photos[k] = im; });
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const lerp = (a, b, p) => a + (b - a) * p;
function rr(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

/*__PERSON__*/

/* ---------- overlays (stage is 360 x 640) ---------- */
function callout(c, t, at, px, py, lx, ly, text, alpha = 1){
  if (t < at || alpha <= 0) return;
  const p = ease((t - at) / .35);
  c.save(); c.globalAlpha = p * alpha;
  const pulse = (t - at) % 1.2;
  c.strokeStyle = "rgba(255,255,255,"+(1-pulse/1.2)*.9+")"; c.lineWidth = 2; c.beginPath(); c.arc(px, py, 4 + pulse*10, 0, 7); c.stroke();
  c.fillStyle = "#fff"; c.beginPath(); c.arc(px, py, 3.6, 0, 7); c.fill();
  c.strokeStyle = "#fff"; c.lineWidth = 1.6; c.beginPath(); c.moveTo(px, py); c.lineTo(lerp(px, lx, p), lerp(py, ly, p)); c.stroke();
  c.font = "700 13px " + FONT; const w = c.measureText(text).width + 22;
  const bx = clamp(lx > px ? lx : lx - w, 16, 344 - w), by = ly - 13;
  c.translate(0, (1-p)*8);
  c.fillStyle = "rgba(255,255,255,.96)"; rr(c, bx, by, w, 26, 6); c.fill();
  c.fillStyle = ORANGE; c.fillRect(bx, by, 4, 26);
  c.fillStyle = "#18212b"; c.textBaseline = "middle"; c.fillText(text, bx + 12, by + 13.5);
  c.restore();
}
function caption(c, t, small, big){
  const p = ease(t / .45);
  c.save(); c.globalAlpha = p; c.translate(0, (1-p)*18);
  const g = c.createLinearGradient(0, 520, 0, 640); g.addColorStop(0, "rgba(10,16,32,0)"); g.addColorStop(.35, "rgba(10,16,32,.82)"); g.addColorStop(1, "rgba(10,16,32,.95)");
  c.fillStyle = g; c.fillRect(-400, 520, 1160, 420);
  c.fillStyle = RED; c.fillRect(22, 566, 5, 46);
  c.textBaseline = "alphabetic";
  c.fillStyle = ORANGE; c.font = "700 13px " + FONT; c.fillText(small, 36, 582);
  c.fillStyle = "#fff"; c.font = "800 23px " + FONT; c.fillText(big, 36, 610);
  c.restore();
}
/* Safety points as a list, used over a photo where pointer positions are unknown. */
function chips(c, t, labels){
  labels.forEach((text, i) => {
    const at = .5 + i * .65; if (t < at) return;
    const p = ease((t - at) / .35);
    c.save(); c.globalAlpha = p; c.translate((1 - p) * -30, 0);
    c.font = "700 14px " + FONT; const w = c.measureText(text).width + 30, y = 90 + i * 42;
    c.fillStyle = "rgba(255,255,255,.95)"; rr(c, 20, y, w, 32, 7); c.fill();
    c.fillStyle = ORANGE; c.fillRect(20, y, 5, 32);
    c.fillStyle = "#18212b"; c.textBaseline = "middle"; c.fillText(text, 36, y + 16.5);
    c.restore();
  });
}
function sky(c, top, bottom){ const g = c.createLinearGradient(0, -300, 0, 640); g.addColorStop(0, top); g.addColorStop(1, bottom); c.fillStyle = g; c.fillRect(-600, -300, 1560, 1240); }
function cone(c, x, y, s){
  c.save(); c.translate(x, y); c.scale(s, s);
  c.fillStyle = "#2a2a2a"; c.fillRect(-14, -3, 28, 5);
  c.fillStyle = ORANGE; c.beginPath(); c.moveTo(-10, -3); c.lineTo(-3, -36); c.lineTo(3, -36); c.lineTo(10, -3); c.fill();
  c.fillStyle = "#f4f4f4"; c.beginPath(); c.moveTo(-7.2, -15); c.lineTo(-5.3, -24); c.lineTo(5.3, -24); c.lineTo(7.2, -15); c.fill();
  c.restore();
}

/* ---------- the company EV: a blue Kia Ray, side view facing right, ground at (x, y) ---------- */
function car(c, x, y, s, o){
  o = o || {};
  c.save(); c.translate(x, y); c.scale(s, s);
  c.fillStyle = "rgba(0,0,0,.22)"; c.beginPath(); c.ellipse(0, 1.5, 102, 6, 0, 0, 7); c.fill();
  const body = () => { c.beginPath();
    c.moveTo(-93, -16); c.quadraticCurveTo(-96.5, -28, -96, -44); c.lineTo(-95.5, -88); c.quadraticCurveTo(-95, -101, -82, -104);
    c.quadraticCurveTo(-20, -106.5, 32, -104); c.quadraticCurveTo(42, -103, 47, -96); c.lineTo(66, -68); c.quadraticCurveTo(69.5, -63.5, 76, -62);
    c.quadraticCurveTo(91, -58.5, 94.5, -50); c.quadraticCurveTo(98, -40, 96, -27); c.quadraticCurveTo(95, -18, 88, -16);
    c.lineTo(76, -16); c.arc(55, -17, 21, 0, Math.PI, true); c.lineTo(-34, -16); c.arc(-55, -17, 21, 0, Math.PI, true); c.lineTo(-93, -16); c.closePath(); };
  const g = c.createLinearGradient(0, -106, 0, -16); g.addColorStop(0, "#4a8ae6"); g.addColorStop(.45, "#2d68cf"); g.addColorStop(1, "#1f4c9c");
  body(); c.fillStyle = g; c.fill();
  c.save(); body(); c.clip();
  c.fillStyle = "rgba(0,0,0,.14)"; c.fillRect(-100, -30, 200, 20);
  c.fillStyle = "rgba(255,255,255,.16)"; c.beginPath(); c.moveTo(-96, -96); c.lineTo(40, -100); c.lineTo(40, -94); c.lineTo(-96, -90); c.fill();
  c.restore();
  // glass, pillars and the driver
  const glass = () => { c.beginPath(); c.moveTo(-88, -94); c.quadraticCurveTo(-87, -98.6, -80, -98.6); c.lineTo(33, -98.6); c.quadraticCurveTo(38, -98, 41, -94); c.lineTo(57.5, -69.5); c.lineTo(-88, -69.5); c.closePath(); };
  glass(); const gg = c.createLinearGradient(0, -99, 0, -69); gg.addColorStop(0, "#2a3a50"); gg.addColorStop(1, "#141c28"); c.fillStyle = gg; c.fill();
  let driver = null;
  if (o.driver){
    c.save(); glass(); c.clip();
    c.fillStyle = "#20262f"; rr(c, -12, -96, 9, 26, 3); c.fill();
    driver = person(c, 10, -20, .72, { view: "side", t: o.t, hipY: -36, legL: [1.45, .2], legR: [1.5, .1], armR: [1.2, 1.75], armL: [1.1, 1.65], lean: -.1, shadow: false, gear: { helmet: false, cap: false, vest: false, gloves: false, badge: true } });
    c.strokeStyle = "#9aa1ab"; c.lineWidth = 2.2; c.beginPath(); c.moveTo(driver.shoulderTop[0], driver.shoulderTop[1]); c.lineTo(driver.hipFront[0], driver.hipFront[1]); c.stroke();
    c.restore();
  }
  c.save(); glass(); c.clip();
  c.fillStyle = "rgba(255,255,255,.13)"; c.beginPath(); c.moveTo(-60, -99); c.lineTo(-38, -99); c.lineTo(-62, -69); c.lineTo(-84, -69); c.fill();
  c.beginPath(); c.moveTo(14, -99); c.lineTo(24, -99); c.lineTo(2, -69); c.lineTo(-8, -69); c.fill();
  c.restore();
  c.fillStyle = "#121820"; c.fillRect(-9, -99, 6, 30); c.fillRect(-63, -99, 5, 30);
  c.strokeStyle = "rgba(255,255,255,.35)"; c.lineWidth = 1.2; c.beginPath(); c.moveTo(-90, -68); c.lineTo(58, -68); c.stroke();
  // doors, handles, mirror, lights
  c.strokeStyle = "rgba(10,25,60,.45)"; c.lineWidth = 1.1;
  c.beginPath(); c.moveTo(-6, -69); c.lineTo(-6, -22); c.moveTo(60, -67); c.lineTo(61, -40); c.moveTo(-62, -69); c.lineTo(-62, -39); c.moveTo(-34, -22); c.lineTo(34, -22); c.stroke();
  c.fillStyle = "rgba(8,20,48,.5)"; rr(c, 30, -61, 10, 3, 1.5); c.fill(); rr(c, -26, -61, 10, 3, 1.5); c.fill();
  c.fillStyle = "#1f4c9c"; c.beginPath(); c.moveTo(52, -72); c.lineTo(60, -75); c.quadraticCurveTo(64.5, -74, 62.5, -68.5); c.lineTo(54, -67.5); c.closePath(); c.fill();
  c.fillStyle = "#f4f7fb"; c.beginPath(); c.moveTo(78, -61); c.lineTo(92, -56); c.quadraticCurveTo(95, -53, 93.5, -50.5); c.lineTo(83, -53.5); c.closePath(); c.fill();
  c.fillStyle = "#ffe7a3"; c.beginPath(); c.arc(88, -54.5, 1.8, 0, 7); c.fill();
  c.fillStyle = "#d3132f"; rr(c, -96.5, -86, 4, 26, 2); c.fill();
  c.fillStyle = "#172033"; rr(c, 84, -34, 12, 9, 3); c.fill();
  c.fillStyle = "#1a1e25"; c.fillRect(-34, -22, 68, 6);
  // charging port on the front panel
  c.fillStyle = "rgba(255,255,255,.55)"; rr(c, 88, -47, 6, 7, 1.5); c.fill();
  // company decal and EV badge
  if (o.logo && logo.complete && logo.naturalWidth){
    c.fillStyle = "#fff"; rr(c, -57, -62, 46, 12, 2.5); c.fill();
    c.drawImage(logo, -55, -60.2, 42, 42 * logo.naturalHeight / logo.naturalWidth);
  }
  c.fillStyle = "rgba(255,255,255,.9)"; c.font = "800 7px " + FONT; c.fillText("EV", 42, -27);
  // wheels
  const spin = o.spin || 0;
  [-55, 55].forEach(wx => {
    c.fillStyle = "#14171c"; c.beginPath(); c.arc(wx, -17, 17, 0, 7); c.fill();
    c.fillStyle = "#262b33"; c.beginPath(); c.arc(wx, -17, 13.5, 0, 7); c.fill();
    c.fillStyle = "#cfd5dc"; c.beginPath(); c.arc(wx, -17, 10.5, 0, 7); c.fill();
    c.strokeStyle = "#8a929c"; c.lineWidth = 2.4;
    for (let k = 0; k < 5; k++){ const a = spin + k * 1.2566; c.beginPath(); c.moveTo(wx, -17); c.lineTo(wx + Math.cos(a) * 9.5, -17 + Math.sin(a) * 9.5); c.stroke(); }
    c.fillStyle = "#5f666f"; c.beginPath(); c.arc(wx, -17, 2.8, 0, 7); c.fill();
  });
  c.restore();
  const at = (px, py) => [x + px * s, y + py * s];
  return { rearTire: at(-66, -26), frontTire: at(55, -17), port: at(91, -43.5), roof: at(-20, -104), window: at(16, -84), driver };
}

/* A round close-up of the driver wearing a seat belt. */
function beltInset(c, t, at, cx, cy, r, from){
  if (t < at) return;
  const p = ease((t - at) / .45);
  c.save(); c.globalAlpha = p;
  c.strokeStyle = "rgba(255,255,255,.95)"; c.lineWidth = 1.8; c.setLineDash([4, 4]);
  c.beginPath(); c.moveTo(from[0], from[1]); c.lineTo(lerp(from[0], cx, p), lerp(from[1], cy + r * .7, p)); c.stroke(); c.setLineDash([]);
  c.translate(cx, cy); const k = lerp(.6, 1, p); c.scale(k, k);
  c.fillStyle = "#fff"; c.beginPath(); c.arc(0, 0, r + 4, 0, 7); c.fill();
  c.save(); c.beginPath(); c.arc(0, 0, r, 0, 7); c.clip();
  const g = c.createLinearGradient(0, -r, 0, r); g.addColorStop(0, "#3c4a5e"); g.addColorStop(1, "#1b2330"); c.fillStyle = g; c.fillRect(-r, -r, 2 * r, 2 * r);
  c.fillStyle = "rgba(170,210,245,.35)"; c.beginPath(); c.moveTo(-r, -r); c.lineTo(r, -r); c.lineTo(r, -18); c.lineTo(-r, -6); c.fill();
  c.fillStyle = "#2a2f38"; rr(c, -48, -30, 22, 100, 9); c.fill(); rr(c, -42, -58, 15, 24, 6); c.fill();
  const d = person(c, -8, 92, 1.45, { view: "side", t, hipY: -32, legL: [1.45, .3], legR: [1.5, .2], armR: [1.35, 1.95], armL: [1.25, 1.85], lean: -.12, shadow: false, gear: { helmet: false, cap: false, vest: false, gloves: false, badge: true } });
  c.strokeStyle = "#5d6570"; c.lineWidth = 6; c.beginPath(); c.moveTo(d.shoulderTop[0], d.shoulderTop[1]); c.lineTo(d.hipFront[0], d.hipFront[1]); c.stroke();
  c.strokeStyle = "#a3abb5"; c.lineWidth = 2.6; c.stroke();
  c.fillStyle = "#c9cfd6"; rr(c, d.hipFront[0] - 6, d.hipFront[1] - 5, 10, 7, 2); c.fill();
  c.fillStyle = "#232a35"; c.fillRect(-r, 40, 2 * r, r);
  c.save(); c.translate(50, -6); c.rotate(-.35); c.strokeStyle = "#101318"; c.lineWidth = 6; c.beginPath(); c.ellipse(0, 0, 7, 26, 0, 0, 7); c.stroke(); c.restore();
  c.restore();
  c.strokeStyle = ORANGE; c.lineWidth = 3; c.beginPath(); c.arc(0, 0, r + 2, 0, 7); c.stroke();
  c.font = "800 13px " + FONT; const w = c.measureText("안전벨트 착용").width + 24;
  c.fillStyle = "#fff"; rr(c, -w / 2, r + 10, w, 26, 13); c.fill();
  c.fillStyle = RED; c.textAlign = "center"; c.textBaseline = "middle"; c.fillText("안전벨트 착용", 0, r + 23.5); c.textAlign = "left";
  c.restore();
}
function noPhone(c, t, at, x, y){
  if (t < at) return;
  const p = ease((t - at) / .35), k = lerp(.4, 1, p);
  c.save(); c.globalAlpha = p; c.translate(x, y); c.scale(k, k);
  c.fillStyle = "#fff"; c.beginPath(); c.arc(0, 0, 25, 0, 7); c.fill();
  c.fillStyle = "#23262b"; rr(c, -7, -13, 14, 26, 3); c.fill(); c.fillStyle = "#6fa8dc"; c.fillRect(-5, -10, 10, 18);
  c.strokeStyle = RED; c.lineWidth = 4; c.beginPath(); c.arc(0, 0, 21, 0, 7); c.moveTo(-15, -15); c.lineTo(15, 15); c.stroke();
  c.restore();
  callout(c, t, at + .1, x, y + 26, x + 30, y + 64, "운전 중 휴대폰 사용 금지");
}

/* ---------- scenes: draw(c, local time) ---------- */
function opening(c, t){
  c.fillStyle = NAVY; c.fillRect(-600, -300, 1560, 1240);
  for (let i = 0; i < 7; i++){
    const sp = 140 + i*35, off = ((t*sp + i*173) % 1300) - 500;
    c.save(); c.globalAlpha = .18 + (i%3)*.08; c.fillStyle = i%2 ? ORANGE : RED;
    c.translate(off, 0); c.rotate(-.5); c.fillRect(-20, -200 + i*90, 260 + i*20, 6 + (i%3)*4); c.restore();
  }
  const p1 = ease((t - .2)/.5), p2 = ease((t - .5)/.5), p3 = ease((t - .8)/.5);
  c.textBaseline = "alphabetic";
  c.globalAlpha = p1; c.fillStyle = ORANGE; c.font = "700 15px " + FONT; c.fillText("홈앤서비스 서비스매니저", 34, 270 + (1-p1)*14);
  c.globalAlpha = p2; c.fillStyle = "#fff"; c.font = "800 38px " + FONT; c.fillText("오늘도 안전하게,", 32, 322 + (1-p2)*14);
  c.globalAlpha = p3; c.fillText("현장으로", 32, 370 + (1-p3)*14);
  c.globalAlpha = p3; c.fillStyle = RED; c.fillRect(34, 392, 70*p3, 5); c.fillStyle = ORANGE; c.fillRect(34 + 74*p3, 392, 30*p3, 5);
  c.globalAlpha = 1;
}
function evCheck(c, t){
  sky(c, "#a8d2ef", "#eaf5fc");
  c.fillStyle = "#d7dde4"; c.fillRect(-600, 170, 1560, 320);
  c.fillStyle = "#c5ccd5"; for (let i = -10; i < 18; i++) c.fillRect(i * 64, 170, 3, 320);
  c.fillStyle = "#b9c9d9"; for (let r = 0; r < 3; r++) for (let i = -10; i < 16; i++) c.fillRect(i * 64 + 14, 196 + r * 72, 36, 40);
  c.fillStyle = "#eef2f6"; c.fillRect(-600, 158, 1560, 14);
  c.fillStyle = "#6c747f"; c.fillRect(-600, 488, 1560, 460);
  c.fillStyle = "#3fae6a"; c.fillRect(-600, 488, 1560, 8);
  const chx = 322;
  c.fillStyle = "#f4f6f8"; rr(c, chx - 18, 330, 40, 162, 6); c.fill();
  c.fillStyle = "#d8dee5"; c.fillRect(chx + 12, 336, 10, 150);
  c.fillStyle = "#3fae6a"; c.fillRect(chx - 18, 330, 40, 10);
  c.fillStyle = "#14202c"; rr(c, chx - 12, 352, 28, 44, 3); c.fill();
  const charge = Math.min(85, 64 + t * 12);
  c.fillStyle = "#53e08a"; c.fillRect(chx - 8, 384, 20 * charge / 100, 6);
  c.fillStyle = "#fff"; c.font = "700 10px " + FONT; c.textAlign = "center"; c.fillText(Math.round(charge) + "%", chx + 2, 375); c.textAlign = "left";
  c.fillStyle = "#2b2f36"; rr(c, chx - 16, 410, 10, 16, 2); c.fill();
  const A = car(c, 172, 522, .95, { t, logo: true });
  c.strokeStyle = "#1e2228"; c.lineWidth = 3.2; c.beginPath(); c.moveTo(chx - 11, 424); c.bezierCurveTo(chx - 22, 520, A.port[0] + 26, 500, A.port[0], A.port[1]); c.stroke();
  person(c, 66, 526, 1.0, { view: "side", t, hipY: -33, legL: [1.25, .2], legR: [0.15, -1.85], footR: 1.5, armR: [.62, .78], armL: [1.0, .45], gear: { helmet: false, cap: true, gloves: true, vest: true } });
  callout(c, t, .45, A.rearTire[0], A.rearTire[1], 30, 352, "타이어 공기압 점검");
  callout(c, t, 1.25, chx + 2, 372, 262, 292, "충전량 확인");
  callout(c, t, 2.05, A.roof[0], A.roof[1], 126, 236, "차량 주변 확인");
}
function driving(c, t){
  sky(c, "#79b7e4", "#dcefff");
  const sc = t * 260;
  c.fillStyle = "#a9cdb6"; c.beginPath(); c.moveTo(-600, 460);
  for (let x = -600; x <= 960; x += 16) c.lineTo(x, 340 + Math.sin((x + sc * .12) / 62) * 18 + Math.sin((x + sc * .12) / 23) * 5);
  c.lineTo(960, 460); c.closePath(); c.fill();
  for (let k = 0; k < 14; k++){
    const bx = ((k * 92 - sc * .4) % 1288 + 1288) % 1288 - 420, h = 60 + (k * 37 % 50);
    c.fillStyle = k % 2 ? "#c7d3df" : "#b6c4d2"; c.fillRect(bx, 452 - h, 70, h);
    c.fillStyle = "#e3eaf1"; for (let r = 0; r < Math.floor(h / 22); r++) for (let q = 0; q < 3; q++) c.fillRect(bx + 8 + q * 20, 452 - h + 8 + r * 22, 12, 10);
  }
  c.fillStyle = "#d3d8de"; c.fillRect(-600, 452, 1560, 24);
  for (let k = 0; k < 10; k++){
    const tx = ((k * 150 - sc * .9) % 1500 + 1500) % 1500 - 420;
    c.fillStyle = "#6b4e36"; c.fillRect(tx - 3, 414, 6, 40);
    c.fillStyle = "#3f9a5c"; c.beginPath(); c.arc(tx, 404, 20, 0, 7); c.arc(tx - 13, 414, 14, 0, 7); c.arc(tx + 13, 414, 14, 0, 7); c.fill();
  }
  const sgx = 440 - t * 215;
  c.fillStyle = "#8b939d"; c.fillRect(sgx - 2.5, 370, 5, 84);
  c.fillStyle = "#fff"; c.beginPath(); c.arc(sgx, 352, 22, 0, 7); c.fill();
  c.strokeStyle = RED; c.lineWidth = 5; c.beginPath(); c.arc(sgx, 352, 18.5, 0, 7); c.stroke();

function renderAt(cv, T){
  const c = cv.getContext("2d");
  const W = cv.width, H = cv.height, sc = Math.min(W / 360, H / 640);
  c.setTransform(1,0,0,1,0,0); c.clearRect(0, 0, W, H);
  let i = CUTS.length - 1; while (i > 0 && T < CUTS[i]) i--;
  const local = T - CUTS[i], dur = (CUTS[i+1] || TOTAL) - CUTS[i], scene = scenes[i];
  const ph = photos[i], usePhoto = !!(ph && ph.complete && ph.naturalWidth);
  if (usePhoto){
    const z = 1 + .08 * clamp(local / dur), k = Math.max(W / ph.naturalWidth, H / ph.naturalHeight) * z;
    c.drawImage(ph, (W - ph.naturalWidth * k) / 2, (H - ph.naturalHeight * k) / 2, ph.naturalWidth * k, ph.naturalHeight * k);
  }
  const zoom = usePhoto ? 1 : 1 + .05 * clamp(local / dur);
  c.setTransform(sc * zoom, 0, 0, sc * zoom, W/2 - 180*sc*zoom, H/2 - 320*sc*zoom);
  if (!usePhoto) scene.draw(c, local);
  else if (scene.photoDraw) scene.photoDraw(c, local);
  else if (scene.labels) chips(c, local, scene.labels);
  if (scene.cap) caption(c, local, scene.cap[0], scene.cap[1]);
  for (let k = 1; k < CUTS.length; k++){
    const d = T - CUTS[k];
    if (d > -.28 && d < .28){
      const p = (d + .28) / .56;
      c.save(); c.translate(lerp(-700, 1060, p), 320); c.rotate(.42);
      c.fillStyle = RED; c.fillRect(-160, -900, 230, 1800); c.fillStyle = ORANGE; c.fillRect(70, -900, 120, 1800);
      c.restore();
    }
  }
  const fade = clamp((T - (TOTAL - .6)) / .6);
  if (fade > 0){ c.setTransform(1,0,0,1,0,0); c.fillStyle = "rgba(255,255,255," + fade + ")"; c.fillRect(0, 0, W, H); }
}

  const ir = ac.createBuffer(2, irLen, ac.sampleRate);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647 * 2 - 1;
  for (let ch = 0; ch < 2; ch++){ const d = ir.getChannelData(ch); for (let i = 0; i < irLen; i++) d[i] = rnd() * Math.pow(1 - i / irLen, 3); }
  rev.buffer = ir; const revGain = ac.createGain(); revGain.gain.value = .35; rev.connect(revGain); revGain.connect(master);
  const noise = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); { const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = rnd(); }
  const delay = ac.createDelay(1); delay.delayTime.value = .375; const fb = ac.createGain(); fb.gain.value = .32;
  delay.connect(fb); fb.connect(delay); const dOut = ac.createGain(); dOut.gain.value = .5; delay.connect(dOut); dOut.connect(master); dOut.connect(rev);
  const T = x => t0 + x;
  const env = (g, t, a, peak, hold, rel) => { g.gain.setValueAtTime(0, T(t)); g.gain.linearRampToValueAtTime(peak, T(t + a)); g.gain.setValueAtTime(peak, T(t + a + hold)); g.gain.exponentialRampToValueAtTime(.0001, T(t + a + hold + rel)); };
  function pad(t, dur, notes, vol, cutoff){
    const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = cutoff; f.Q.value = .7;
    const g = ac.createGain(); env(g, t, .5, vol, Math.max(0, dur - .5), 1.2); f.connect(g); g.connect(master); g.connect(rev);
    notes.forEach(m => [-6, 6].forEach(det => { const o = ac.createOscillator(); o.type = "sawtooth"; o.frequency.value = mf(m); o.detune.value = det; o.connect(f); o.start(T(t)); o.stop(T(t + dur + 1.4)); }));
  }
  function bass(t, m, vol){ const o = ac.createOscillator(); o.type = "sawtooth"; o.frequency.value = mf(m); const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 420; const g = ac.createGain(); env(g, t, .005, vol, .08, .14); o.connect(f); f.connect(g); g.connect(master); o.start(T(t)); o.stop(T(t + .3)); }
  function kick(t, vol){ const o = ac.createOscillator(); o.frequency.setValueAtTime(150, T(t)); o.frequency.exponentialRampToValueAtTime(42, T(t + .14)); const g = ac.createGain(); g.gain.setValueAtTime(vol, T(t)); g.gain.exponentialRampToValueAtTime(.001, T(t + .4)); o.connect(g); g.connect(master); o.start(T(t)); o.stop(T(t + .45)); }
  function noiseHit(t, type, freq, vol, dec, toRev){ const s = ac.createBufferSource(); s.buffer = noise; const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; const g = ac.createGain(); g.gain.setValueAtTime(vol, T(t)); g.gain.exponentialRampToValueAtTime(.001, T(t + dec)); s.connect(f); f.connect(g); g.connect(master); if (toRev) g.connect(rev); s.start(T(t)); s.stop(T(t + dec + .05)); }
  function pluck(t, m, vol){ const o = ac.createOscillator(); o.type = "triangle"; o.frequency.value = mf(m); const g = ac.createGain(); env(g, t, .004, vol, .02, .2); o.connect(g); g.connect(master); g.connect(delay); o.start(T(t)); o.stop(T(t + .3)); }
  function lead(t, m, dur, vol){
    const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 2400; const g = ac.createGain(); env(g, t, .03, vol, Math.max(.02, dur - .12), .2);
    f.connect(g); g.connect(master); g.connect(delay); g.connect(rev);
    [-8, 8].forEach(det => { const o = ac.createOscillator(); o.type = "sawtooth"; o.frequency.value = mf(m); o.detune.value = det; o.connect(f); o.start(T(t)); o.stop(T(t + dur + .3)); });
  }
  function riser(t, dur, vol){
    const s = ac.createBufferSource(); s.buffer = noise; s.loop = true; const f = ac.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 2;
    f.frequency.setValueAtTime(300, T(t)); f.frequency.exponentialRampToValueAtTime(7000, T(t + dur));
    const g = ac.createGain(); g.gain.setValueAtTime(.0001, T(t)); g.gain.exponentialRampToValueAtTime(vol, T(t + dur)); g.gain.linearRampToValueAtTime(0, T(t + dur + .05));
    s.connect(f); f.connect(g); g.connect(master); g.connect(rev); s.start(T(t)); s.stop(T(t + dur + .1));
  }
  const chords = { Dm: [38, [50,53,57], [62,65,69,74], [[69,2],[72,1],[74,1]]], Bb: [34, [46,50,53], [58,62,65,70], [[74,2],[72,1],[70,1]]],
                   F: [41, [53,57,60], [65,69,72,77], [[72,3],[69,1]]], C: [36, [48,52,55], [60,64,67,72], [[67,2],[69,1],[72,1]]] };
  const prog = ["Dm","Bb","F","C","Dm","Bb","F","C","Dm","Bb","F","C"];
  const G0 = 2.5, HIT = 27;
  pad(0, G0, chords.Dm[1], .05, 700); riser(.4, G0 - .4, .25);
  prog.forEach((name, b) => {
    const bt = G0 + b * 2, [root, tri, arp, mel] = chords[name];
    pad(bt, 2, tri, b < 2 ? .045 : .055, b < 2 ? 900 : b < 6 ? 1500 : 2000);
    for (let e = 0; e < 8; e++) bass(bt + e * .25, root + (e % 4 === 3 ? 12 : 0), .32);
    for (let q = 0; q < 4; q++){
      const x = bt + q * .5;
      if (b >= 2 || q % 2 === 0) kick(x, .9);
      if (b >= 2 && q % 2 === 1) noiseHit(x, "bandpass", 1800, .35, .16, true);
      if (b >= 6) noiseHit(x + .25, "highpass", 7000, .12, .05, false);
      if (b >= 10) noiseHit(x + .25, "highpass", 5000, .08, .18, false);
    }
    if (b >= 6) for (let s16 = 0; s16 < 16; s16++) pluck(bt + s16 * .125, arp[s16 % 4] + (b >= 10 && s16 >= 8 ? 12 : 0), .045);
    if (b >= 6){ let mt = bt; mel.forEach(([m, beats]) => { lead(mt, m, beats * .5, b >= 10 ? .05 : .035); mt += beats * .5; }); }
  });
  for (let i = 0; i < 24; i++){ const x = HIT - 1.5 + 1.5 * Math.pow(i / 24, .8); noiseHit(x, "bandpass", 2000, .08 + i * .012, .08, false); }
  riser(HIT - 1.9, 1.9, .35);
  kick(HIT, 1); noiseHit(HIT, "highpass", 3500, .45, 2.2, true);
  const boom = ac.createOscillator(); boom.frequency.setValueAtTime(70, T(HIT)); boom.frequency.exponentialRampToValueAtTime(38, T(HIT + 2.4));
  const bg = ac.createGain(); bg.gain.setValueAtTime(.8, T(HIT)); bg.gain.exponentialRampToValueAtTime(.001, T(HIT + 2.8)); boom.connect(bg); bg.connect(master); boom.start(T(HIT)); boom.stop(T(HIT + 3));
  pad(HIT, 2.6, [50,54,57,62,66], .06, 2600); bass(HIT, 26, .4);
  [74, 81, 86].forEach((m, i) => { const o = ac.createOscillator(); o.type = "sine"; o.frequency.value = mf(m); const g = ac.createGain(); env(g, HIT + .3 + i * .18, .005, .09, .05, 1.8); o.connect(g); g.connect(master); g.connect(rev); o.start(T(HIT + .3 + i * .18)); o.stop(T(HIT + 2.6 + i * .18)); });
  master.gain.setValueAtTime(.68, T(TOTAL - .8)); master.gain.linearRampToValueAtTime(0, T(TOTAL));
  return { stop(){ try { master.gain.cancelScheduledValues(ac.currentTime); master.gain.setValueAtTime(master.gain.value, ac.currentTime); master.gain.linearRampToValueAtTime(0, ac.currentTime + .3); } catch(e){} } };
}

/* ---------- player ---------- */
const box = document.getElementById("intro"), cv = document.getElementById("introCanvas");
let raf = 0, ac = null, music = null, startAt = 0, running = false;
function fit(){ const dpr = Math.min(window.devicePixelRatio || 1, 2); cv.width = Math.round(cv.clientWidth * dpr); cv.height = Math.round(cv.clientHeight * dpr); }
function finish(){
  if (!running && box.hidden) return;
  running = false; cancelAnimationFrame(raf);
  if (music) music.stop();
  if (ac) setTimeout(() => { try { ac.close(); } catch(e){} ac = null; }, 500);
  box.classList.add("out"); setTimeout(() => { box.hidden = true; box.classList.remove("out"); }, 520);
}
function frame(){
  if (!running) return;
  const T = ac && ac.state === "running" ? ac.currentTime - startAt : (performance.now() - startAt) / 1000;
  if (T >= TOTAL) return finish();
  renderAt(cv, Math.max(0, T)); raf = requestAnimationFrame(frame);
}
function play(withSound){
  document.getElementById("introGate").hidden = true;
  fit(); running = true;
  if (withSound){
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state !== "running") ac.resume();
      startAt = ac.currentTime + .05; music = buildMusic(ac, ac.destination, startAt);
    } catch(e){ ac = null; }
  }
  if (!ac || ac.state !== "running") { if (ac) { /* audio blocked: run on the clock */ } startAt = performance.now(); }
  raf = requestAnimationFrame(frame);
  // if the audio clock starts a moment later, switch to it without a jump
  if (ac && ac.state !== "running") ac.onstatechange = () => { if (ac && ac.state === "running") { const T = (performance.now() - startAt) / 1000; startAt = ac.currentTime - T; } };
}
function open(fromUser){
  box.hidden = false; fit(); renderAt(cv, 0);
  if (fromUser || window.AndroidBridge) play(true);
  else document.getElementById("introGate").hidden = false;
}
window.addEventListener("resize", () => { if (!box.hidden) { fit(); if (!running) renderAt(cv, 0); } });
document.getElementById("introSkip").addEventListener("click", finish);
document.getElementById("introNo").addEventListener("click", finish);
document.getElementById("introPlay").addEventListener("click", () => play(true));
window.__intro = { renderAt, buildMusic, TOTAL, open: () => open(true), skip: finish };
let seen = false; try { seen = sessionStorage.getItem("tvcode:intro") === "1"; sessionStorage.setItem("tvcode:intro", "1"); } catch(e){}
const replay = document.getElementById("introReplay"); if (replay) replay.addEventListener("click", () => open(true));
if (!seen && !/[?&#]nointro/.test(location.href)) open(false);
})();
</script>
