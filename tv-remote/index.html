<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TV 리모컨 동조코드</title>
<meta name="description" content="제조사별 TV 리모컨 동조코드 검색">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&family=Do+Hyeon&display=swap">
<style>
/* Layout: sticky control deck (search + filters) over a single-column brand list; detail opens as a bottom sheet of keypad-style code keys */
:root{
  --bg:#eceff2; --panel:#f8f9fb; --ink:#18212b; --muted:#5d6874; --line:#d3d9e0;
  --key:#ffffff; --key-edge:#c4ccd5; --accent:#c8392b; --accent-ink:#ffffff; --soft:#f3e1de;
  --done:#2f7d55; --done-soft:#dcefe4; --shadow:rgba(24,33,43,.10);
  --f-display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171d; --panel:#1a2129; --ink:#e7ebef; --muted:#97a2ad; --line:#2c3640;
  --key:#232c35; --key-edge:#38444f; --accent:#ec5a49; --accent-ink:#1a0d0b; --soft:#3a2321;
  --done:#5cc48d; --done-soft:#1d3428; --shadow:rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --panel:#1a2129; --ink:#e7ebef; --muted:#97a2ad; --line:#2c3640;
  --key:#232c35; --key-edge:#38444f; --accent:#ec5a49; --accent-ink:#1a0d0b; --soft:#3a2321;
  --done:#5cc48d; --done-soft:#1d3428; --shadow:rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{padding-block:22px 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,7vw,38px);line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 .dot{display:inline-block;width:.32em;height:.32em;border-radius:50%;background:var(--accent);margin-left:.12em;vertical-align:.5em;box-shadow:0 0 0 4px var(--soft)}
.sub{color:var(--muted);font-size:13px;margin:6px 0 0}
.stats{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:700}

.deck{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:16px;padding:13px 44px 13px 44px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--accent)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;width:32px;height:32px;border-radius:50%;cursor:pointer;color:var(--muted);font-size:18px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 10px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);color:var(--ink)}
.chip.fav[aria-pressed="true"]{color:var(--accent)}
select.chip{appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.idx{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.idx::-webkit-scrollbar{display:none}
.idx button{flex:0 0 auto;min-width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:14px;color:var(--ink)}
.idx button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.idx button:disabled{opacity:.3;cursor:default}

.codehit{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.codehit h2{margin:0 0 6px;font-size:14px;font-weight:500;color:var(--muted)}
.codehit h2 b{font-family:var(--f-mono);color:var(--accent);font-size:16px}

.quick{margin-top:14px}
.quick h2,.listhead{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:500;margin:0 0 8px}
.quick .row{gap:6px}
.listhead{margin-top:18px;display:flex;justify-content:space-between}
.letter{font-family:var(--f-display);font-size:20px;color:var(--accent);margin:18px 0 6px;padding-left:4px}
ul.list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px 11px 14px;cursor:pointer;text-align:left;width:100%}
.item:hover{border-color:var(--key-edge)}
.item .nm{font-weight:500;min-width:0;overflow-wrap:anywhere}
.item .nm small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.item .meta{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.item .codes{grid-column:1/-1;font-family:var(--f-mono);font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .codes mark{background:var(--soft);color:var(--accent);border-radius:4px;padding:0 2px}
.star{color:var(--accent)}
.gtag{border:1px solid var(--line);border-radius:6px;padding:0 5px}
.empty{padding:40px 0;text-align:center;color:var(--muted)}

/* bottom sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,18,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:20px 20px 0 0;max-height:88%;overflow:auto;box-shadow:0 -10px 40px var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .in{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:8px 24px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sh-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sh-head h2{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.15;margin:0;overflow-wrap:anywhere;min-width:0}
.sh-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.icon-btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;height:38px;min-width:38px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;font-size:13px}
.icon-btn.on{color:var(--accent);border-color:var(--accent)}
.how{margin:14px 0 12px;background:var(--panel);border:1px dashed var(--key-edge);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted)}
.how b{color:var(--ink)}
.progress{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:8px;gap:8px;flex-wrap:wrap}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--done);width:0;transition:width .2s}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.key{position:relative;border:1px solid var(--key-edge);border-bottom-width:3px;background:var(--key);border-radius:12px;padding:12px 4px 8px;cursor:pointer;text-align:center;font-family:var(--f-mono);font-weight:700;font-size:22px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.key small{display:block;font-family:var(--f-body);font-weight:400;font-size:10px;letter-spacing:0;color:var(--muted)}
.key:active{transform:translateY(1px);border-bottom-width:2px}
.key.done{background:var(--done-soft);border-color:var(--done);color:var(--done)}
.key.done small::after{content:" · 해봄"}
.key.ok{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.key.ok small{color:var(--accent-ink)}
.key.ok small::after{content:" · 성공!"}
.sh-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30}
footer{margin-top:28px;color:var(--muted);font-size:12px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* developer mode */
.devbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 10px;margin-top:10px;font-size:13px}
.devbar b{font-weight:700;margin-right:auto}
.devbar button{border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);background:transparent;color:var(--bg);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px}
.devbar button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tag{font-family:var(--f-body);font-size:11px;border-radius:5px;padding:0 5px;border:1px solid var(--accent);color:var(--accent)}
.note{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--soft);font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.form{display:grid;gap:12px;margin-top:12px}
.form label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.form input,.form textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.form textarea{min-height:96px;resize:vertical;font-family:var(--f-mono)}
.form textarea.prose{font-family:var(--f-body)}
.form input:focus,.form textarea:focus{outline:none;border-color:var(--accent)}
.form .hint{font-size:12px;color:var(--muted)}
.form .err{font-size:13px;color:var(--accent)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 14px;cursor:pointer;font-size:14px}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--accent);border-color:var(--accent)}
.btn.danger.armed{background:var(--accent);color:var(--accent-ink)}
.pin{display:flex;gap:8px;justify-content:center;margin:18px 0 8px}
.pin input{width:100%;max-width:220px;text-align:center;font-family:var(--f-mono);font-size:26px;letter-spacing:.4em;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink)}
.changes{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:6px}
.changes li{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px}
.changes li span{min-width:0;overflow-wrap:anywhere}
.devlink{border:0;background:transparent;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline;padding:6px}
.carrier{display:inline-block;font-size:12px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:6px;padding:1px 7px;margin-right:6px;vertical-align:1px}
.how{white-space:pre-line}
.sync{font-size:12px;color:var(--muted);margin-top:6px}
pre.export{max-height:200px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:11px;white-space:pre-wrap;word-break:break-all;user-select:all}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>TV 리모컨 동조코드<span class="dot" aria-hidden="true"></span></h1>
      <p class="sub"><span class="carrier">SK브로드밴드 B tv 리모컨 전용</span> 고객 댁 TV 제조사를 찾고, 코드를 하나씩 눌러 확인하세요</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <div class="devbar" id="devbar" hidden>
    <b>개발자 모드</b>
    <button class="primary" id="devAdd">+ 제조사 추가</button>
    <button id="devGuide">사용법 문구</button>
    <button id="devChanges">변경 내역</button>
    <button id="devLock">잠금</button>
  </div>

  <div class="deck">
    <div class="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="제조사 · 초성(ㅅㅅ) · 영문 · 코드번호" autocomplete="off" aria-label="검색">
      <button class="clear" id="clear" aria-label="검색어 지우기" hidden>×</button>
    </div>
    <div class="row">
      <div class="seg" role="group" aria-label="정렬">
        <button id="s-name" data-sort="name" aria-pressed="true">가나다순</button>
        <button id="s-group" data-sort="group" aria-pressed="false">그룹순</button>
        <button id="s-count" data-sort="count" aria-pressed="false">코드 많은순</button>
      </div>
      <select class="chip" id="group" aria-label="그룹 필터"></select>
      <button class="chip fav" id="favOnly" aria-pressed="false">★ 즐겨찾기</button>
    </div>
    <div class="idx" id="idx" role="group" aria-label="첫 글자"></div>
  </div>

  <div id="codehit" class="codehit" hidden></div>
  <section class="quick" id="quick">
    <h2>많이 찾는 제조사</h2>
    <div class="row" id="quickRow"></div>
  </section>
  <div class="listhead"><span id="listTitle">전체 제조사</span><span id="count"></span></div>
  <div id="list"></div>
  <footer>
    SK브로드밴드 B tv 리모컨 전용 · 원본: BT리모컨 TV 동조코드 (2024.04.22)<br>KT·LG U+ 리모컨은 코드 번호가 달라서 이 목록을 쓸 수 없어요
    <div><button class="devlink" id="introReplay">인트로 다시 보기</button> <button class="devlink" id="devOpen">개발자 모드</button></div>
    <div class="sync" id="syncNote"></div>
  </footer>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle" hidden>
  <div class="in">
    <div class="grab" aria-hidden="true"></div>
    <div class="sh-head">
      <div style="min-width:0">
        <h2 id="shTitle"></h2>
        <p id="shSub"></p>
      </div>
      <div class="row" style="flex-wrap:nowrap">
        <button class="icon-btn" id="shEdit" hidden>수정</button>
        <button class="icon-btn" id="shFav" aria-label="즐겨찾기">☆</button>
        <button class="icon-btn" id="shClose" aria-label="닫기">✕</button>
      </div>
    </div>
    <div id="shBody"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

/* ---------- data model ---------- */
let brands = [], byKey = {};
function derive(key, src, origin){
  const name = src.name;
  const m = name.match(/^([^(]+?)\s*\((.+)\)\s*(.*)$/);
  let title = name, sub = "";
  if (m && /[가-힣]/.test(m[1])) { title = (m[1] + (m[3] ? " " + m[3] : "")).trim(); sub = m[2]; }
  const first = title.trim()[0] || "#";
  let letter;
  if (isHangul(first)) { const c = choOf(first); letter = BASECHO[c] || c; }
  else if (/[a-z]/i.test(first)) letter = first.toUpperCase();
  else letter = "#";
  return { key, name, title, sub, group: +src.group || 0, codes: src.codes || [], note: src.note || "",
    letter, ko: isHangul(first), n: norm(name), cho: [...name].map(choOf).join("").replace(/\s/g,""), order: origin.order, status: origin.status };
}
function rebuild(){
  const out = [];
  RAW.forEach((b, i) => {
    const key = "b" + i, e = edits[key];
    if (e && e.deleted) return;
    out.push(derive(key, e || b, { order: i, status: e ? "edited" : "" }));
  });
  Object.entries(edits).filter(([k, e]) => k[0] === "n" && !e.deleted)
    .sort((a, b) => (a[1].updatedAt || 0) - (b[1].updatedAt || 0))
    .forEach(([k, e], j) => out.push(derive(k, e, { order: RAW.length + j, status: "added" })));
  brands = out; byKey = Object.fromEntries(out.map(b => [b.key, b]));
  const total = new Set(brands.flatMap(b => b.codes)).size;
  $("stats").innerHTML = `제조사 <b>${brands.length}</b><br>코드 <b>${total}</b>종`;
  const groups = [...new Set(brands.map(b => b.group))].sort((a,b)=>a-b);
  const sel = $("group"), cur = sel.value || "all";
  sel.innerHTML = `<option value="all">전체 그룹</option>` + groups.map(g => `<option value="${g}">GROUP ${pad2(g)}</option>`).join("");
  sel.value = groups.includes(+cur) ? cur : "all";
  if (sel.value === "all") st.group = "all";
  $("quickRow").innerHTML = POPULAR.map(k => byKey[k]).filter(Boolean)
    .map(b => `<button class="chip" data-open="${b.key}">${esc(b.title)}</button>`).join("");
}

/* ---------- list ---------- */
function matches(b, q){
  const nq = norm(q);
  if (!nq) return true;
  if (b.n.includes(nq)) return true;
  if (/^[ㄱ-ㅎ]+$/.test(nq) && b.cho.includes(nq)) return true;
  if (/^\d+$/.test(nq) && b.codes.some(c => c.startsWith(nq))) return true;
  if (b.note && norm(b.note).includes(nq)) return true;
  return false;
}
function sorted(arr){
  const a = arr.slice();
  if (st.sort === "name") a.sort((x,y) => (x.ko===y.ko ? collator.compare(x.title, y.title) : x.ko ? -1 : 1));
  else if (st.sort === "group") a.sort((x,y) => x.group - y.group || x.order - y.order);
  else a.sort((x,y) => y.codes.length - x.codes.length || collator.compare(x.title,y.title));
  return a;
}
function renderIdx(base){
  const have = new Set(base.map(b => b.letter));
  const btn = l => `<button data-letter="${l}" aria-pressed="${st.letter===l}" ${have.has(l)?"":"disabled"}>${l}</button>`;
  $("idx").innerHTML = `<button data-letter="" aria-pressed="${!st.letter}" style="padding:0 10px">전체</button>` + INDEX_KO.map(btn).join("") + INDEX_EN.map(btn).join("");
}
function codeLine(b, q){
  const dq = /^\d{1,3}$/.test(q) ? q : null;
  return b.codes.map(c => dq && c.startsWith(dq) ? `<mark>${c}</mark>` : c).join(" ") || "코드 없음";
}
function itemHTML(b, q){
  const m = marks[b.key] || {};
  const tried = Object.keys(m).length, ok = Object.values(m).includes(2);
  const tag = dev && b.status ? `<span class="tag">${b.status === "added" ? "추가됨" : "수정됨"}</span>` : "";
  return `<li><button class="item" data-open="${b.key}">
    <span class="nm">${favs.has(b.key)?'<span class="star">★</span> ':''}${esc(b.title)} ${tag}${b.sub?`<small>${esc(b.sub)}</small>`:""}</span>
    <span class="meta">${ok?'<span style="color:var(--done)">성공</span>':tried?`<span>${tried}/${b.codes.length}</span>`:""}<span class="gtag">G${pad2(b.group)}</span><span>${b.codes.length}개</span></span>
    <span class="codes">${codeLine(b,q)}</span></button></li>`;
}
function grouped(list, keyOf, label, q){
  let html = "", cur, buf = [];
  const flush = () => { if (buf.length) html += `<div class="letter">${label(cur)}</div><ul class="list">${buf.join("")}</ul>`; };
  list.forEach(b => { const k = keyOf(b); if (k !== cur) { flush(); cur = k; buf = []; } buf.push(itemHTML(b,q)); });
  flush();
  return html;
}
function render(){
  const q = st.q.trim();
  const base = brands.filter(b => (st.group==="all" || b.group==+st.group) && (!st.fav || favs.has(b.key)) && matches(b,q));
  renderIdx(base);
  const list = sorted(st.letter ? base.filter(b => b.letter === st.letter) : base);
  $("count").textContent = `${list.length}곳`;
  $("listTitle").textContent = q ? `“${q}” 검색 결과` : st.fav ? "즐겨찾기" : "전체 제조사";
  $("quick").hidden = !!(q || st.fav || st.letter || st.group!=="all");
  $("clear").hidden = !st.q;
  $("devbar").hidden = !dev;

  const nq = norm(q);
  if (/^\d{3}$/.test(nq)) {
    const users = sorted(brands.filter(b => b.codes.includes(nq)));
    $("codehit").hidden = false;
    $("codehit").innerHTML = `<h2>코드 <b>${nq}</b> 를 쓰는 제조사 · ${users.length}곳</h2>` + (users.length ? `<div class="row" style="gap:6px">${users.map(b=>`<button class="chip" data-open="${b.key}">${esc(b.title)}</button>`).join("")}</div>` : `<div style="color:var(--muted);font-size:13px">이 번호는 목록에 없어요.</div>`);
  } else $("codehit").hidden = true;

  if (!list.length) { $("list").innerHTML = `<div class="empty">${st.fav && !favs.size ? "아직 즐겨찾기가 없어요. 제조사를 열고 ☆를 눌러 추가하세요." : "찾는 제조사가 없어요. 영문이나 초성으로도 검색해 보세요."}</div>`; return; }
  if (st.sort === "name" && !st.letter) $("list").innerHTML = grouped(list, b => b.letter, l => l, q);
  else if (st.sort === "group") $("list").innerHTML = grouped(list, b => b.group, g => `GROUP ${pad2(g)}`, q);
  else $("list").innerHTML = `<ul class="list">${list.map(b => itemHTML(b,q)).join("")}</ul>`;
}

      <span class="hint">예: 리모컨 동조 모드로 들어가는 버튼 순서를 적어 두면 현장에서 편해요.</span>
      <div class="btns"><button class="btn primary" type="submit">저장</button><button class="btn" type="button" id="gDefault">기본 문구로</button><button class="btn" type="button" id="fCancel">취소</button></div></form>`;
  } else if (mode === "changes") {
    const rows = Object.entries(edits).map(([k, e]) => {
      const orig = k[0] === "b" ? RAW[+k.slice(1)] : null;
      const kind = e.deleted ? "삭제" : orig ? "수정" : "추가";
      return { k, e, kind, name: e.name || (orig && orig.name) || k };
    }).sort((a,b) => (b.e.updatedAt||0) - (a.e.updatedAt||0));
    $("shTitle").textContent = "변경 내역";
    $("shSub").textContent = `원본 시트와 다른 항목 ${rows.length}개`;
    $("shBody").innerHTML = rows.length ? `<ul class="changes">${rows.map(r => `<li><span><span class="tag">${r.kind}</span> ${esc(r.name)}</span>
        ${r.kind === "삭제" ? `<button class="chip" data-restore="${r.k}">복구</button>` : `<button class="chip" data-open="${r.k}">보기</button>`}</li>`).join("")}</ul>
      <p class="hint" style="font-size:12px;color:var(--muted);margin:14px 0 6px">아래 내용을 복사해 Claude에게 주면 원본 데이터에 반영할 수 있어요.</p>
      <pre class="export" id="exportText">${esc(JSON.stringify(edits))}</pre>
      <div class="sh-actions"><button class="icon-btn" id="copyExport">변경 내역 복사</button></div>`
      : `<div class="empty">아직 바꾼 내용이 없어요.</div>`;
    $("shBody").insertAdjacentHTML("beforeend", `<form class="form" id="importForm" novalidate style="margin-top:20px">
      <label>다른 기기의 변경 내역 가져오기<textarea id="fImport" placeholder="다른 휴대폰에서 '변경 내역 복사'한 내용을 붙여넣으세요"></textarea></label>
      <div class="err" id="fErr" hidden></div>
      <div class="btns"><button class="btn primary" type="submit">가져오기</button></div></form>`);
  }
}

function parseCodes(text){
  const parts = text.split(/[\s,，、/]+/).filter(Boolean);
  const bad = parts.filter(p => !/^\d{1,3}$/.test(p));
  const codes = [];
  parts.filter(p => /^\d{1,3}$/.test(p)).forEach(p => { const c = p.padStart(3,"0"); if (!codes.includes(c)) codes.push(c); });
  return { codes, bad };
}
function showErr(t){ const el = $("fErr"); el.textContent = t; el.hidden = false; }
async function persist(key, body){
  edits[key] = body; rebuild(); render();
  try { await remote.save(key, body); return true; }
  catch(e){ toast(e && e.code === "permission_denied" ? "저장 권한이 없어요. 이 페이지의 소유자만 수정할 수 있어요" : "저장하지 못했어요. 잠시 후 다시 시도하세요"); return false; }
}

let toastT;
function toast(t){ const el=$("toast"); el.textContent=t; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,2000); }
function copy(t, msg){
  const fail = () => toast("복사가 막혀 있어요. 길게 눌러 직접 복사하세요");
  if (window.AndroidBridge) { try { if (AndroidBridge.copy(t)) { toast(msg); return; } } catch(e){} }
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => toast(msg), fail); else fail();
}
async function sha256(s){
  if (!(window.crypto && crypto.subtle) && window.AndroidBridge) return AndroidBridge.sha256(s);
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2,"0")).join("");
}

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const t = e.target;
  const o = t.closest("[data-open]"); if (o) { openSheet(o.dataset.open); return; }
  const r = t.closest("[data-restore]"); if (r) {
    const k = r.dataset.restore; const prev = edits[k];
    if (k[0] === "b" && !prev.name) { delete edits[k]; rebuild(); render(); renderSheet(); try { await remote.remove(k); } catch(err){ toast("복구하지 못했어요"); } }
    else { await persist(k, { ...prev, deleted:false, updatedAt: Date.now() }); renderSheet(); }
    toast("복구했어요"); return;
  }
  const s = t.closest("[data-sort]"); if (s) { st.sort = s.dataset.sort; local.set("sort", st.sort); syncSort(); render(); return; }
  const l = t.closest("[data-letter]"); if (l && !l.disabled) { st.letter = l.dataset.letter || null; render(); window.scrollTo({top:0}); return; }
  const k = t.closest("[data-code]"); if (k && openKey && mode === "view") {
    const m = marks[openKey] = marks[openKey] || {}; const c = k.dataset.code;
    if (!m[c]) m[c] = 1; else if (m[c] === 1) { for (const x in m) if (m[x]===2) m[x]=1; m[c] = 2; } else delete m[c];
    if (!Object.keys(m).length) delete marks[openKey];
    local.set("marks", marks); renderSheet(); return;
  }
  switch (t.id) {
    case "shReset": delete marks[openKey]; local.set("marks", marks); renderSheet(); break;
    case "shCopy": { const b = byKey[openKey]; copy(`${b.name}: ${b.codes.join(", ")}`, "코드를 복사했어요"); break; }
    case "copyExport": copy(JSON.stringify(edits), "변경 내역을 복사했어요"); break;
    case "fCancel": if (byKey[openKey]) { mode = "view"; renderSheet(); } else closeSheet(); break;
    case "gDefault": $("fGuide").value = DEFAULT_GUIDE; break;
    case "fRevert": {
      delete edits[openKey]; rebuild(); render(); mode = "view"; renderSheet(); toast("원본으로 되돌렸어요");
      try { await remote.remove(openKey); } catch(err){ toast("되돌리지 못했어요"); }
      break;
    }
    case "fDelete": {
      if (!delArmed) { delArmed = true; t.classList.add("armed"); t.textContent = "한 번 더 누르면 삭제"; break; }
      const b = byKey[openKey], key = openKey;
      await persist(key, { name: b.name, group: b.group, codes: b.codes, note: b.note, deleted: true, updatedAt: Date.now() });
      closeSheet(); toast(`${b.title} 삭제됨 · 변경 내역에서 복구할 수 있어요`);
      break;
    }
  }
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "loginForm") {
    let ok = false; try { ok = (await sha256(PASS_SALT + $("fPass").value)) === PASS_HASH; } catch(err){}
    if (!ok) { showErr("비밀번호가 맞지 않아요"); $("fPass").select(); return; }
    dev = true; try { sessionStorage.setItem("tvcode:dev","1"); } catch(err){}
    closeSheet(); toast("개발자 모드를 켰어요");
  } else if (f.id === "editForm") {
    const name = $("fName").value.trim().replace(/\s+/g," ");
    const group = parseInt($("fGroup").value, 10);
    const { codes, bad } = parseCodes($("fCodes").value);
    if (!name) return showErr("제조사 이름을 입력하세요");
    if (!(group > 0 && group < 100)) return showErr("그룹 번호는 1~99 사이 숫자로 입력하세요");
    if (bad.length) return showErr(`코드는 숫자 3자리만 됩니다: ${bad.slice(0,5).join(", ")}`);
    if (!codes.length) return showErr("코드를 하나 이상 입력하세요");
    const key = mode === "add" ? "n" + Date.now().toString(36) : openKey;
    const body = { name, group, codes, note: $("fNote").value.trim(), deleted:false, updatedAt: Date.now() };
    if (await persist(key, body)) { openKey = key; mode = "view"; renderSheet(); toast("저장했어요"); }
  } else if (f.id === "importForm") {
    let data;
    try { data = JSON.parse($("fImport").value); } catch(err){ return showErr("붙여넣은 내용을 읽지 못했어요. '변경 내역 복사'한 내용을 그대로 붙여넣으세요"); }
    const valid = data && typeof data === "object" && !Array.isArray(data) ? Object.entries(data).filter(([k, e]) =>
      /^[bn][0-9a-z]+$/.test(k) && e && typeof e.name === "string" && Array.isArray(e.codes) && e.codes.every(c => /^\d{3}$/.test(c))) : [];
    if (!valid.length) return showErr("가져올 항목이 없어요");
    let n = 0;
    for (const [k, e] of valid) { if (await persist(k, { name: e.name, group: +e.group || 0, codes: e.codes, note: String(e.note || ""), deleted: !!e.deleted, updatedAt: +e.updatedAt || Date.now() })) n++; }
    toast(`${n}개 항목을 가져왔어요`); renderSheet();
  } else if (f.id === "guideForm") {
    guide = $("fGuide").value.trim() || DEFAULT_GUIDE;
    try { await remote.saveGuide(guide); toast("사용법 문구를 저장했어요"); closeSheet(); }
    catch(err){ toast("저장하지 못했어요. 이 페이지의 소유자만 수정할 수 있어요"); }
  }
});
function syncSort(){ document.querySelectorAll("[data-sort]").forEach(b => b.setAttribute("aria-pressed", b.dataset.sort===st.sort)); }
$("q").addEventListener("input", e => { st.q = e.target.value; st.letter = null; render(); });
$("clear").addEventListener("click", () => { $("q").value = ""; st.q = ""; render(); $("q").focus(); });
$("group").addEventListener("change", e => { st.group = e.target.value; st.letter = null; render(); });
$("favOnly").addEventListener("click", e => { st.fav = !st.fav; e.currentTarget.setAttribute("aria-pressed", st.fav); render(); });
$("shClose").addEventListener("click", closeSheet);
$("scrim").addEventListener("click", closeSheet);
$("shEdit").addEventListener("click", () => { mode = "edit"; delArmed = false; renderSheet(); });
$("shFav").addEventListener("click", () => { const k=openKey; favs.has(k)?favs.delete(k):favs.add(k); local.set("favs",[...favs]); renderSheet(); toast(favs.has(k)?"즐겨찾기에 추가했어요":"즐겨찾기에서 뺐어요"); });
$("devOpen").addEventListener("click", () => dev ? toast("이미 개발자 모드예요") : openPanel("login"));
$("devAdd").addEventListener("click", () => openPanel("add"));
$("devGuide").addEventListener("click", () => openPanel("guide"));
$("devChanges").addEventListener("click", () => openPanel("changes"));
$("devLock").addEventListener("click", () => { dev = false; try { sessionStorage.removeItem("tvcode:dev"); } catch(e){} render(); toast("개발자 모드를 잠갔어요"); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && openKey) closeSheet(); });
window.appBack = () => {
  if (openKey) { if ((mode === "edit") && byKey[openKey]) { mode = "view"; renderSheet(); } else closeSheet(); return true; }
  if (st.q || st.letter || st.fav || st.group !== "all") { st.q = ""; $("q").value = ""; st.letter = null; st.fav = false; $("favOnly").setAttribute("aria-pressed", false); st.group = "all"; $("group").value = "all"; render(); return true; }
  return false;
};
syncSort(); rebuild(); render();
</script>

<script>
(() => {
const TOTAL = 20;
const CUTS = [0, 2, 5, 8, 11, 13.5, 16.5];
const RED = "#ea002c", ORANGE = "#f47725", NAVY = "#0f1830";
const FONT = '"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const logo = document.getElementById("introLogoImg");
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const lerp = (a, b, p) => a + (b - a) * p;

/* ---------- drawing helpers (stage is 360 x 640) ---------- */
function rr(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function seg(c, x, y, a, len){ return [x + Math.sin(a)*len, y + Math.cos(a)*len]; }
function limb(c, x, y, angs, lens, width, color){
  const [x1,y1] = seg(c, x, y, angs[0], lens[0]);
  const [x2,y2] = seg(c, x1, y1, angs[1], lens[1]);
  c.strokeStyle = color; c.lineWidth = width; c.lineCap = "round"; c.lineJoin = "round";
  c.beginPath(); c.moveTo(x,y); c.lineTo(x1,y1); c.lineTo(x2,y2); c.stroke();
  return [x1,y1,x2,y2];
}
/* A field worker, front (or back) view, feet at (x,y). Angles: 0 = straight down, + = toward screen right. */
function worker(c, x, y, s, o){
  const g = Object.assign({helmet:true, alarm:false, harness:false, gloves:true, gaiters:false, boots:true, vest:true}, o.gear || {});
  const t = o.t || 0;
  c.save(); c.translate(x, y); c.scale(s, s);
  const legL = o.legL || [0.08,0], legR = o.legR || [-0.08,0];
  const armL = o.armL || [0.25,0.1], armR = o.armR || [-0.25,-0.1];
  const hy = o.kneel ? -40 : -55;
  // legs
  const legs = [[-7, legL], [7, legR]].map(([hx, a]) => {
    const p = limb(c, hx, hy, a, [27, 26], 10, "#26324d");
    if (g.gaiters){
      const ax = lerp(p[0], p[2], .3), ay = lerp(p[1], p[3], .3), bx = lerp(p[0], p[2], .9), by = lerp(p[1], p[3], .9);
      c.strokeStyle = "#9aa3b2"; c.lineWidth = 11.5; c.beginPath(); c.moveTo(ax,ay); c.lineTo(bx,by); c.stroke();
      c.strokeStyle = "#6b7484"; c.lineWidth = 1.4;
      for (let k = 0; k < 3; k++){ const q = .4 + k*.2; const mx = lerp(p[0],p[2],q), my = lerp(p[1],p[3],q); c.beginPath(); c.moveTo(mx-5.5,my); c.lineTo(mx+5.5,my); c.stroke(); }
    }
    if (g.boots){ c.fillStyle = "#23201d"; rr(c, p[2]-7, p[3]-3, 15, 8, 3); c.fill(); c.fillStyle = "#4a4540"; c.fillRect(p[2]-7, p[3]+3, 15, 2); }
    return p;
  });

      if (t >= at && t < at + .9){
        const q = (t - at) / .9; c.strokeStyle = "rgba(83,224,138," + (1 - q) + ")"; c.lineWidth = 3; c.beginPath(); c.arc(pt[0], pt[1], 8 + q * 22, 0, 7); c.stroke();
      }
    });
    const done = ease((t - 2.4) / .3);
    if (done > 0){ c.globalAlpha = done; c.fillStyle = RED; rr(c, 192, 478, 156, 34, 17); c.fill(); c.fillStyle = "#fff"; c.font = "800 14px " + FONT; c.fillText("착용 완료 · 작업 시작", 210, 500); c.globalAlpha = 1; }
  },
  // 6: logo
  (c, t) => {
    c.fillStyle = "#fff"; c.fillRect(-600, -300, 1560, 1240);
    const sw = ease(t / .6);
    c.save(); c.translate(180, 320); c.rotate(-.35);
    c.fillStyle = RED; c.fillRect(-700 + sw * 300, -160, 900, 18);
    c.fillStyle = ORANGE; c.fillRect(-200 - sw * 300 + 300, 215, 900, 12);
    c.restore();
    const p = ease((t - .25) / .7);
    if (logo.complete && logo.naturalWidth){
      const lw = 290 * lerp(1.12, 1, p), lh = lw * logo.naturalHeight / logo.naturalWidth;
      c.globalAlpha = p; c.drawImage(logo, 180 - lw/2, 300 - lh/2, lw, lh); c.globalAlpha = 1;
    }
    const q = ease((t - .9) / .6);
    c.globalAlpha = q; c.fillStyle = "#18212b"; c.font = "800 19px " + FONT; c.textAlign = "center";
    c.fillText("안전한 작업이", 180, 384 + (1-q)*10); c.fillText("최고의 서비스입니다", 180, 412 + (1-q)*10);
    c.fillStyle = "#8a94a0"; c.font = "500 12px " + FONT; c.fillText("B tv 리모컨 TV 동조코드", 180, 470);
    c.textAlign = "left"; c.globalAlpha = 1;
  }
];

function renderAt(cv, T){
  const c = cv.getContext("2d");
  const W = cv.width, H = cv.height, sc = Math.min(W / 360, H / 640);
  c.setTransform(1,0,0,1,0,0); c.clearRect(0, 0, W, H);
  let i = CUTS.length - 1; while (i > 0 && T < CUTS[i]) i--;
  const local = T - CUTS[i], dur = (CUTS[i+1] || TOTAL) - CUTS[i];
  const zoom = 1 + .05 * clamp(local / dur);
  c.setTransform(sc * zoom, 0, 0, sc * zoom, W/2 - 180*sc*zoom, H/2 - 320*sc*zoom);
  scenes[i](c, local);
  // diagonal wipe across each cut
  for (let k = 1; k < CUTS.length; k++){
    const d = T - CUTS[k];
    if (d > -.28 && d < .28){
      const p = (d + .28) / .56;
      c.save(); c.translate(lerp(-700, 1060, p), 320); c.rotate(.42);
      c.fillStyle = RED; c.fillRect(-160, -900, 230, 1800); c.fillStyle = ORANGE; c.fillRect(70, -900, 120, 1800);
      c.restore();
    }
  }
  const fade = clamp((T - (TOTAL - .6)) / .6);
  if (fade > 0){ c.setTransform(1,0,0,1,0,0); c.fillStyle = "rgba(255,255,255," + fade + ")"; c.fillRect(0, 0, W, H); }
}

/* ---------- music (Web Audio, about 20 s) ---------- */
function buildMusic(ac, out, t0){
  const mf = m => 440 * Math.pow(2, (m - 69) / 12);
  const master = ac.createGain(); master.gain.value = .68;
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4;
  const outG = ac.createGain(); outG.gain.value = .7; master.connect(comp); comp.connect(outG); outG.connect(out);
  const rev = ac.createConvolver(); const irLen = Math.floor(ac.sampleRate * 2.6);
  const ir = ac.createBuffer(2, irLen, ac.sampleRate);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647 * 2 - 1;
  for (let ch = 0; ch < 2; ch++){ const d = ir.getChannelData(ch); for (let i = 0; i < irLen; i++) d[i] = rnd() * Math.pow(1 - i / irLen, 3); }
  rev.buffer = ir; const revGain = ac.createGain(); revGain.gain.value = .35; rev.connect(revGain); revGain.connect(master);
  const noise = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); { const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = rnd(); }
  const delay = ac.createDelay(1); delay.delayTime.value = .375; const fb = ac.createGain(); fb.gain.value = .32;
  delay.connect(fb); fb.connect(delay); const dOut = ac.createGain(); dOut.gain.value = .5; delay.connect(dOut); dOut.connect(master); dOut.connect(rev);
  const T = x => t0 + x;
  const env = (g, t, a, peak, hold, rel) => { g.gain.setValueAtTime(0, T(t)); g.gain.linearRampToValueAtTime(peak, T(t + a)); g.gain.setValueAtTime(peak, T(t + a + hold)); g.gain.exponentialRampToValueAtTime(.0001, T(t + a + hold + rel)); };
  function pad(t, dur, notes, vol, cutoff){
    const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = cutoff; f.Q.value = .7;
    const g = ac.createGain(); env(g, t, .5, vol, Math.max(0, dur - .5), 1.2); f.connect(g); g.connect(master); g.connect(rev);
    notes.forEach(m => [-6, 6].forEach(det => { const o = ac.createOscillator(); o.type = "sawtooth"; o.frequency.value = mf(m); o.detune.value = det; o.connect(f); o.start(T(t)); o.stop(T(t + dur + 1.4)); }));
  }
  function bass(t, m, vol){ const o = ac.createOscillator(); o.type = "sawtooth"; o.frequency.value = mf(m); const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 420; const g = ac.createGain(); env(g, t, .005, vol, .08, .14); o.connect(f); f.connect(g); g.connect(master); o.start(T(t)); o.stop(T(t + .3)); }
  function kick(t, vol){ const o = ac.createOscillator(); o.frequency.setValueAtTime(150, T(t)); o.frequency.exponentialRampToValueAtTime(42, T(t + .14)); const g = ac.createGain(); g.gain.setValueAtTime(vol, T(t)); g.gain.exponentialRampToValueAtTime(.001, T(t + .4)); o.connect(g); g.connect(master); o.start(T(t)); o.stop(T(t + .45)); }
  function noiseHit(t, type, freq, vol, dec, toRev){ const s = ac.createBufferSource(); s.buffer = noise; const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; const g = ac.createGain(); g.gain.setValueAtTime(vol, T(t)); g.gain.exponentialRampToValueAtTime(.001, T(t + dec)); s.connect(f); f.connect(g); g.connect(master); if (toRev) g.connect(rev); s.start(T(t)); s.stop(T(t + dec + .05)); }
  function pluck(t, m, vol){ const o = ac.createOscillator(); o.type = "triangle"; o.frequency.value = mf(m); const g = ac.createGain(); env(g, t, .004, vol, .02, .2); o.connect(g); g.connect(master); g.connect(delay); o.start(T(t)); o.stop(T(t + .3)); }
  function riser(t, dur, vol){
    const s = ac.createBufferSource(); s.buffer = noise; s.loop = true; const f = ac.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 2;
    f.frequency.setValueAtTime(300, T(t)); f.frequency.exponentialRampToValueAtTime(7000, T(t + dur));
    const g = ac.createGain(); g.gain.setValueAtTime(.0001, T(t)); g.gain.exponentialRampToValueAtTime(vol, T(t + dur)); g.gain.linearRampToValueAtTime(0, T(t + dur + .05));
    s.connect(f); f.connect(g); g.connect(master); g.connect(rev); s.start(T(t)); s.stop(T(t + dur + .1));
  }
  const chords = { Dm: [38, [50,53,57], [62,65,69,74]], Bb: [34, [46,50,53], [58,62,65,70]], F: [41, [53,57,60], [65,69,72,77]], C: [36, [48,52,55], [60,64,67,72]] };
  const prog = ["Dm","Bb","F","C","Dm","Bb","F"];
  pad(0, 2, chords.Dm[1], .05, 700); riser(.2, 1.8, .25);
  prog.forEach((name, b) => {
    const bt = 2 + b * 2, [root, tri, arp] = chords[name];
    pad(bt, 2, tri, b < 3 ? .045 : .055, b < 3 ? 900 : 1600);
    for (let e = 0; e < 8; e++){ const x = bt + e * .25; bass(x, root + (e % 4 === 3 ? 12 : 0), .32); }
    for (let q = 0; q < 4; q++){
      const x = bt + q * .5;
      if (bt < 5 ? q % 2 === 0 : true) kick(x, .9);
      if (bt >= 5 && q % 2 === 1) noiseHit(x, "bandpass", 1800, .35, .16, true);
      if (bt >= 8) noiseHit(x + .25, "highpass", 7000, .12, .05, false);
    }
    if (bt >= 8) for (let s16 = 0; s16 < 16; s16++) pluck(bt + s16 * .125, arp[s16 % 4] + (s16 >= 8 && bt >= 12 ? 12 : 0), .05);
  });
  for (let i = 0; i < 24; i++){ const x = 15 + 1.5 * Math.pow(i / 24, .8); noiseHit(x, "bandpass", 2000, .08 + i * .012, .08, false); }
  riser(14.6, 1.9, .35);
  // impact + logo chord
  const hit = 16.5;
  kick(hit, 1); noiseHit(hit, "highpass", 3500, .45, 2.2, true);
  const boom = ac.createOscillator(); boom.frequency.setValueAtTime(70, T(hit)); boom.frequency.exponentialRampToValueAtTime(38, T(hit + 2.4));
  const bg = ac.createGain(); bg.gain.setValueAtTime(.8, T(hit)); bg.gain.exponentialRampToValueAtTime(.001, T(hit + 2.8)); boom.connect(bg); bg.connect(master); boom.start(T(hit)); boom.stop(T(hit + 3));
  pad(hit, 2.4, [50,54,57,62,66], .06, 2600); bass(hit, 26, .4);
  [74, 81, 86].forEach((m, i) => { const o = ac.createOscillator(); o.type = "sine"; o.frequency.value = mf(m); const g = ac.createGain(); env(g, hit + .3 + i * .18, .005, .09, .05, 1.8); o.connect(g); g.connect(master); g.connect(rev); o.start(T(hit + .3 + i * .18)); o.stop(T(hit + 2.6 + i * .18)); });
  master.gain.setValueAtTime(.68, T(TOTAL - .8)); master.gain.linearRampToValueAtTime(0, T(TOTAL));
  return { stop(){ try { master.gain.cancelScheduledValues(ac.currentTime); master.gain.setValueAtTime(master.gain.value, ac.currentTime); master.gain.linearRampToValueAtTime(0, ac.currentTime + .3); } catch(e){} } };
}

/* ---------- player ---------- */
const box = document.getElementById("intro"), cv = document.getElementById("introCanvas");
let raf = 0, ac = null, music = null, startAt = 0, running = false;
function fit(){ const dpr = Math.min(window.devicePixelRatio || 1, 2); cv.width = Math.round(cv.clientWidth * dpr); cv.height = Math.round(cv.clientHeight * dpr); }
function finish(){
  if (!running && box.hidden) return;
  running = false; cancelAnimationFrame(raf);
  if (music) music.stop();
  if (ac) setTimeout(() => { try { ac.close(); } catch(e){} ac = null; }, 500);
  box.classList.add("out"); setTimeout(() => { box.hidden = true; box.classList.remove("out"); }, 520);
}
function frame(){
  if (!running) return;
  const T = ac && ac.state === "running" ? ac.currentTime - startAt : (performance.now() - startAt) / 1000;
  if (T >= TOTAL) return finish();
  renderAt(cv, Math.max(0, T)); raf = requestAnimationFrame(frame);
}
function play(withSound){
  document.getElementById("introGate").hidden = true;
  fit(); running = true;
  if (withSound){
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state !== "running") ac.resume();
      startAt = ac.currentTime + .05; music = buildMusic(ac, ac.destination, startAt);
    } catch(e){ ac = null; }
  }
  if (!ac || ac.state !== "running") { if (ac) { /* audio blocked: run on the clock */ } startAt = performance.now(); }
  raf = requestAnimationFrame(frame);
  // if the audio clock starts a moment later, switch to it without a jump
  if (ac && ac.state !== "running") ac.onstatechange = () => { if (ac && ac.state === "running") { const T = (performance.now() - startAt) / 1000; startAt = ac.currentTime - T; } };
}
function open(fromUser){
  box.hidden = false; fit(); renderAt(cv, 0);
  if (fromUser || window.AndroidBridge) play(true);
  else document.getElementById("introGate").hidden = false;
}
window.addEventListener("resize", () => { if (!box.hidden) { fit(); if (!running) renderAt(cv, 0); } });
document.getElementById("introSkip").addEventListener("click", finish);
document.getElementById("introNo").addEventListener("click", finish);
document.getElementById("introPlay").addEventListener("click", () => play(true));
window.__intro = { renderAt, buildMusic, TOTAL, open: () => open(true) };
let seen = false; try { seen = sessionStorage.getItem("tvcode:intro") === "1"; sessionStorage.setItem("tvcode:intro", "1"); } catch(e){}
const replay = document.getElementById("introReplay"); if (replay) replay.addEventListener("click", () => open(true));
if (!seen && !/[?&#]nointro/.test(location.href)) open(false);
})();
</script>
