<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TV 리모컨 동조코드</title>
<meta name="description" content="제조사별 TV 리모컨 동조코드 검색">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&family=Do+Hyeon&display=swap">
<style>
/* Layout: sticky control deck (search + filters) over a single-column brand list; detail opens as a bottom sheet of keypad-style code keys */
:root{
  --bg:#eceff2; --panel:#f8f9fb; --ink:#18212b; --muted:#5d6874; --line:#d3d9e0;
  --key:#ffffff; --key-edge:#c4ccd5; --accent:#c8392b; --accent-ink:#ffffff; --soft:#f3e1de;
  --done:#2f7d55; --done-soft:#dcefe4; --shadow:rgba(24,33,43,.10);
  --f-display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171d; --panel:#1a2129; --ink:#e7ebef; --muted:#97a2ad; --line:#2c3640;
  --key:#232c35; --key-edge:#38444f; --accent:#ec5a49; --accent-ink:#1a0d0b; --soft:#3a2321;
  --done:#5cc48d; --done-soft:#1d3428; --shadow:rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --panel:#1a2129; --ink:#e7ebef; --muted:#97a2ad; --line:#2c3640;
  --key:#232c35; --key-edge:#38444f; --accent:#ec5a49; --accent-ink:#1a0d0b; --soft:#3a2321;
  --done:#5cc48d; --done-soft:#1d3428; --shadow:rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{padding-block:22px 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,7vw,38px);line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 .dot{display:inline-block;width:.32em;height:.32em;border-radius:50%;background:var(--accent);margin-left:.12em;vertical-align:.5em;box-shadow:0 0 0 4px var(--soft)}
.sub{color:var(--muted);font-size:13px;margin:6px 0 0}
.stats{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:700}

.deck{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:16px;padding:13px 44px 13px 44px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--accent)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;width:32px;height:32px;border-radius:50%;cursor:pointer;color:var(--muted);font-size:18px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 10px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);color:var(--ink)}
.chip.fav[aria-pressed="true"]{color:var(--accent)}
select.chip{appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.idx{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.idx::-webkit-scrollbar{display:none}
.idx button{flex:0 0 auto;min-width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:14px;color:var(--ink)}
.idx button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.idx button:disabled{opacity:.3;cursor:default}

.codehit{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.codehit h2{margin:0 0 6px;font-size:14px;font-weight:500;color:var(--muted)}
.codehit h2 b{font-family:var(--f-mono);color:var(--accent);font-size:16px}

.quick{margin-top:14px}
.quick h2,.listhead{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:500;margin:0 0 8px}
.quick .row{gap:6px}
.listhead{margin-top:18px;display:flex;justify-content:space-between}
.letter{font-family:var(--f-display);font-size:20px;color:var(--accent);margin:18px 0 6px;padding-left:4px}
ul.list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px 11px 14px;cursor:pointer;text-align:left;width:100%}
.item:hover{border-color:var(--key-edge)}
.item .nm{font-weight:500;min-width:0;overflow-wrap:anywhere}
.item .nm small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.item .meta{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.item .codes{grid-column:1/-1;font-family:var(--f-mono);font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .codes mark{background:var(--soft);color:var(--accent);border-radius:4px;padding:0 2px}
.star{color:var(--accent)}
.gtag{border:1px solid var(--line);border-radius:6px;padding:0 5px}
.empty{padding:40px 0;text-align:center;color:var(--muted)}

/* bottom sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,18,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:20px 20px 0 0;max-height:88%;overflow:auto;box-shadow:0 -10px 40px var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .in{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:8px 24px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sh-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sh-head h2{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.15;margin:0;overflow-wrap:anywhere;min-width:0}
.sh-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.icon-btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;height:38px;min-width:38px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;font-size:13px}
.icon-btn.on{color:var(--accent);border-color:var(--accent)}
.how{margin:14px 0 12px;background:var(--panel);border:1px dashed var(--key-edge);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted)}
.how b{color:var(--ink)}
.progress{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:8px;gap:8px;flex-wrap:wrap}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--done);width:0;transition:width .2s}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.key{position:relative;border:1px solid var(--key-edge);border-bottom-width:3px;background:var(--key);border-radius:12px;padding:12px 4px 8px;cursor:pointer;text-align:center;font-family:var(--f-mono);font-weight:700;font-size:22px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.key small{display:block;font-family:var(--f-body);font-weight:400;font-size:10px;letter-spacing:0;color:var(--muted)}
.key:active{transform:translateY(1px);border-bottom-width:2px}
.key.done{background:var(--done-soft);border-color:var(--done);color:var(--done)}
.key.done small::after{content:" · 해봄"}
.key.ok{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.key.ok small{color:var(--accent-ink)}
.key.ok small::after{content:" · 성공!"}
.sh-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30}
footer{margin-top:28px;color:var(--muted);font-size:12px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>TV 리모컨 동조코드<span class="dot" aria-hidden="true"></span></h1>
      <p class="sub">제조사를 찾고, 코드를 하나씩 눌러 확인하세요</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="deck">
    <div class="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="제조사 · 초성(ㅅㅅ) · 영문 · 코드번호" autocomplete="off" aria-label="검색">
      <button class="clear" id="clear" aria-label="검색어 지우기" hidden>×</button>
    </div>
    <div class="row">
      <div class="seg" role="group" aria-label="정렬">
        <button id="s-name" data-sort="name" aria-pressed="true">가나다순</button>
        <button id="s-group" data-sort="group" aria-pressed="false">그룹순</button>
        <button id="s-count" data-sort="count" aria-pressed="false">코드 많은순</button>
      </div>
      <select class="chip" id="group" aria-label="그룹 필터"></select>
      <button class="chip fav" id="favOnly" aria-pressed="false">★ 즐겨찾기</button>
    </div>
    <div class="idx" id="idx" role="group" aria-label="첫 글자"></div>
  </div>

  <div id="codehit" class="codehit" hidden></div>
  <section class="quick" id="quick">
    <h2>많이 찾는 제조사</h2>
    <div class="row" id="quickRow"></div>
  </section>
  <div class="listhead"><span id="listTitle">전체 제조사</span><span id="count"></span></div>
  <div id="list"></div>
  <footer>원본: BT리모컨 TV 동조코드 (2024.04.22) · 코드가 안 맞으면 같은 목록의 다음 코드를 시도하세요</footer>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle" hidden>
  <div class="in">
    <div class="grab" aria-hidden="true"></div>
    <div class="sh-head">
      <div style="min-width:0">
        <h2 id="shTitle"></h2>
        <p id="shSub"></p>
      </div>
      <div class="row" style="flex-wrap:nowrap">
        <button class="icon-btn" id="shFav" aria-label="즐겨찾기">☆</button>
        <button class="icon-btn" id="shClose" aria-label="닫기">✕</button>
      </div>
    </div>
    <div class="how"><b>사용법</b> · 코드를 앞에서부터 차례로 리모컨에 입력해 보세요. 입력해 본 코드는 <b>한 번 탭</b>하면 ‘해봄’으로, TV가 반응하면 <b>한 번 더 탭</b>해서 ‘성공’으로 표시하세요. 표시는 이 기기에 저장됩니다.</div>
    <div class="progress"><span id="shProg"></span><button class="chip" id="shReset">표시 초기화</button></div>
    <div class="bar"><i id="shBar"></i></div>
    <div class="keys" id="shKeys"></div>
    <div class="sh-actions">
      <button class="icon-btn" id="shCopy">코드 전체 복사</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

"PORTLAND","group":9,"codes":["092","150","154","206"]},{"name":"PROTON","group":9,"codes":["032","092","122"]},{"name":"QUASAR","group":9,"codes":["049","067","071","250"]},{"name":"RADIO SHACK","group":9,"codes":["053","185","092"]},{"name":"RCA","group":9,"codes":["010","097","150","167","037","370"]},{"name":"RUNCO","group":9,"codes":["416"]},{"name":"REALISTIC","group":9,"codes":["053"]},{"name":"SCOTT","group":9,"codes":["053","092"]},{"name":"SEARS","group":9,"codes":["092","150","151","163","167","037","206","089","090"]},{"name":"SOUNDESIGN","group":9,"codes":["053","081"]},{"name":"SPECTRICON","group":9,"codes":["193"]},{"name":"SSS","group":9,"codes":["053"]},{"name":"SYLVANIA","group":9,"codes":["051","150","167","185","037","068","081","082","085"]},{"name":"TATUNG","group":9,"codes":["049"]},{"name":"TCL","group":9,"codes":["334","009","369","376","460","461"]},{"name":"TEAC","group":9,"codes":["407"]},{"name":"TECHNICS","group":9,"codes":["095","071"]},{"name":"TECHWOOD","group":9,"codes":["150"]},{"name":"TEKNIKA","group":9,"codes":["053","092","150","154","163","165","052","206","081"]},{"name":"THOMSON","group":9,"codes":["409"]},{"name":"TMK","group":9,"codes":["150"]},{"name":"TOTEVISION","group":9,"codes":["092"]},{"name":"UNIDEN","group":9,"codes":["406"]},{"name":"VICTOR","group":9,"codes":["066"]},{"name":"VIDTECH","group":9,"codes":["150"]},{"name":"VIEWSONIC","group":9,"codes":["405"]},{"name":"VIZIO","group":9,"codes":["364"]},{"name":"WARDS","group":9,"codes":["092","150","154","167","185","037","068","071","206","085"]},{"name":"WESTING HOUSE","group":9,"codes":["038","014","402"]},{"name":"YAMAHA","group":9,"codes":["150"]},{"name":"YUPITERUZENITH","group":9,"codes":["053"]},{"name":"ZONDA","group":9,"codes":["193"]}];
const CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const BASE = {"ㄲ":"ㄱ","ㄸ":"ㄷ","ㅃ":"ㅂ","ㅆ":"ㅅ","ㅉ":"ㅈ"};
const INDEX_KO = "ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎ".split("");
const INDEX_EN = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const POPULAR = ["삼성(SAMSUNG)","엘지(LG,금성,GOLDSTAR)","대우(DAEWOO)","샤오미(XIAOMI)","SONY","TCL","PHILIPS","PANASONIC","HISENSE","이노스 (INNOS)"];
const isHangul = c => c >= "가" && c <= "힣";
const choOf = c => isHangul(c) ? CHO[Math.floor((c.charCodeAt(0)-0xAC00)/588)] : c;
const norm = s => s.toLowerCase().replace(/[\s()\-,.&_·]/g,"");

const brands = RAW.map((b,i) => {
  const name = b.name;
  const m = name.match(/^([^(]+?)\s*\((.+)\)\s*(.*)$/);
  let title = name, sub = "";
  if (m && /[가-힣]/.test(m[1])) { title = (m[1] + (m[3] ? " " + m[3] : "")).trim(); sub = m[2]; }
  const first = title.trim()[0] || "#";
  let letter;
  if (isHangul(first)) { const c = choOf(first); letter = BASE[c] || c; }
  else if (/[a-z]/i.test(first)) letter = first.toUpperCase();
  else letter = "#";
  const n = norm(name);
  const cho = [...name].map(choOf).join("").replace(/\s/g,"");
  return { id:i, name, title, sub, group:b.group, codes:b.codes, letter, ko:isHangul(first), n, cho };
});
const collator = new Intl.Collator("ko");
const totalCodes = new Set(brands.flatMap(b => b.codes)).size;
document.getElementById("stats").innerHTML = `제조사 <b>${brands.length}</b><br>코드 <b>${totalCodes}</b>종`;

const store = {
  get(k, d){ try { const v = localStorage.getItem("tvcode:"+k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem("tvcode:"+k, JSON.stringify(v)); } catch(e){} }
};
let favs = new Set(store.get("favs", []));
let marks = store.get("marks", {}); // {brandName: {code: 1|2}}
const st = { q:"", sort: store.get("sort","name"), group:"all", fav:false, letter:null };

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// group select
const groups = [...new Set(brands.map(b => b.group))].sort((a,b)=>a-b);
$("group").innerHTML = `<option value="all">전체 그룹</option>` + groups.map(g => `<option value="${g}">GROUP ${String(g).padStart(2,"0")}</option>`).join("");

// quick picks
$("quickRow").innerHTML = POPULAR.map(n => brands.find(b => b.name === n)).filter(Boolean)
  .map(b => `<button class="chip" data-open="${b.id}">${esc(b.title)}</button>`).join("");

function matches(b, q){
  if (!q) return true;
  const nq = norm(q);
  if (!nq) return true;
  if (b.n.includes(nq)) return true;
  if (/^[ㄱ-ㅎ]+$/.test(nq) && b.cho.includes(nq)) return true;
  if (/^\d+$/.test(nq) && b.codes.some(c => c.startsWith(nq.padStart(nq.length,"0")) || c === nq.padStart(3,"0"))) return true;
  return false;
}
function sorted(arr){
  const a = arr.slice();
  if (st.sort === "name") a.sort((x,y) => (x.ko===y.ko ? collator.compare(x.title, y.title) : x.ko ? -1 : 1));
  else if (st.sort === "group") a.sort((x,y) => x.group - y.group || x.id - y.id);
  else a.sort((x,y) => y.codes.length - x.codes.length || collator.compare(x.title,y.title));
  return a;
}
function renderIdx(base){
  const have = new Set(base.map(b => b.letter));
  const btn = l => `<button data-letter="${l}" aria-pressed="${st.letter===l}" ${have.has(l)?"":"disabled"}>${l}</button>`;
  $("idx").innerHTML = `<button data-letter="" aria-pressed="${!st.letter}" style="padding:0 10px">전체</button>` + INDEX_KO.map(btn).join("") + INDEX_EN.map(btn).join("");
}
function codeLine(b, q){
  const dq = /^\d{1,3}$/.test(q) ? q : null;
  return b.codes.map(c => dq && (c===dq.padStart(3,"0") || c.startsWith(dq)) ? `<mark>${c}</mark>` : c).join(" ");
}
function itemHTML(b, q){
  const tried = Object.keys(marks[b.name]||{}).length;
  const ok = Object.values(marks[b.name]||{}).includes(2);
  return `<li><button class="item" data-open="${b.id}">
    <span class="nm">${favs.has(b.name)?'<span class="star">★</span> ':''}${esc(b.title)}${b.sub?`<small>${esc(b.sub)}</small>`:""}</span>
    <span class="meta">${ok?'<span style="color:var(--done)">성공</span>':tried?`<span>${tried}/${b.codes.length}</span>`:""}<span class="gtag">G${String(b.group).padStart(2,"0")}</span><span>${b.codes.length}개</span></span>
    <span class="codes">${codeLine(b,q)}</span></button></li>`;
}
function render(){
  const q = st.q.trim();
  let base = brands.filter(b => (st.group==="all" || b.group==+st.group) && (!st.fav || favs.has(b.name)) && matches(b,q));
  renderIdx(base);
  let list = st.letter ? base.filter(b => b.letter === st.letter) : base;
  list = sorted(list);
  $("count").textContent = `${list.length}곳`;
  $("listTitle").textContent = q ? `“${q}” 검색 결과` : st.fav ? "즐겨찾기" : "전체 제조사";
  $("quick").hidden = !!(q || st.fav || st.letter || st.group!=="all");
  $("clear").hidden = !st.q;

  const nq = norm(q);
  if (/^\d{3}$/.test(nq)) {
    const users = brands.filter(b => b.codes.includes(nq));
    $("codehit").hidden = false;
    $("codehit").innerHTML = `<h2>코드 <b>${nq}</b> 를 쓰는 제조사 · ${users.length}곳</h2>` + (users.length ? `<div class="row" style="gap:6px">${sorted(users).map(b=>`<button class="chip" data-open="${b.id}">${esc(b.title)}</button>`).join("")}</div>` : `<div style="color:var(--muted);font-size:13px">이 번호는 목록에 없어요.</div>`);
  } else $("codehit").hidden = true;

  if (!list.length) { $("list").innerHTML = `<div class="empty">${st.fav && !favs.size ? "아직 즐겨찾기가 없어요. 제조사를 열고 ☆를 눌러 추가하세요." : "찾는 제조사가 없어요. 영문이나 초성으로도 검색해 보세요."}</div>`; return; }
  if (st.sort === "name" && !st.letter) {
    let html = "", cur = null, buf = [];
    const flush = () => { if (cur!==null) html += `<div class="letter">${cur}</div><ul class="list">${buf.join("")}</ul>`; };
    list.forEach(b => { if (b.letter !== cur) { flush(); cur = b.letter; buf = []; } buf.push(itemHTML(b,q)); });
    flush();
    $("list").innerHTML = html;
  } else if (st.sort === "group") {
    let html = "", cur = null, buf = [];
    const flush = () => { if (cur!==null) html += `<div class="letter">GROUP ${String(cur).padStart(2,"0")}</div><ul class="list">${buf.join("")}</ul>`; };
    list.forEach(b => { if (b.group !== cur) { flush(); cur = b.group; buf = []; } buf.push(itemHTML(b,q)); });
    flush();
    $("list").innerHTML = html;
  } else {
    $("list").innerHTML = `<ul class="list">${list.map(b => itemHTML(b,q)).join("")}</ul>`;
  }
}

// sheet
let openB = null;
function openSheet(b){
  openB = b;
  $("shTitle").textContent = b.title;
  $("shSub").textContent = `${b.sub ? b.sub + " · " : ""}GROUP ${String(b.group).padStart(2,"0")} · 코드 ${b.codes.length}개`;
  renderSheet();
  $("scrim").hidden = false; $("sheet").hidden = false; $("sheet").scrollTop = 0;
  $("shClose").focus();
}
function renderSheet(){
  const b = openB, m = marks[b.name] || {};
  $("shFav").textContent = favs.has(b.name) ? "★" : "☆";
  $("shFav").classList.toggle("on", favs.has(b.name));
  $("shKeys").innerHTML = b.codes.map((c,i) => `<button class="key ${m[c]===2?"ok":m[c]?"done":""}" data-code="${c}">${c}<small>${i+1}번째</small></button>`).join("");
  const n = Object.keys(m).length, ok = Object.entries(m).find(([,v]) => v===2);
  $("shProg").textContent = ok ? `성공한 코드: ${ok[0]}` : `${n} / ${b.codes.length}개 시도`;
  $("shBar").style.width = (ok ? 100 : n / b.codes.length * 100) + "%";
}
function closeSheet(){ $("scrim").hidden = true; $("sheet").hidden = true; openB = null; render(); }
let toastT;
function toast(t){ const el=$("toast"); el.textContent=t; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,1600); }

document.addEventListener("click", e => {
  const o = e.target.closest("[data-open]"); if (o) { openSheet(brands[+o.dataset.open]); return; }
  const s = e.target.closest("[data-sort]"); if (s) { st.sort = s.dataset.sort; store.set("sort", st.sort); syncSort(); render(); return; }
  const l = e.target.closest("[data-letter]"); if (l && !l.disabled) { st.letter = l.dataset.letter || null; render(); window.scrollTo({top:0}); return; }
  const k = e.target.closest("[data-code]"); if (k && openB) {
    const m = marks[openB.name] = marks[openB.name] || {}; const c = k.dataset.code;
    if (!m[c]) m[c] = 1; else if (m[c] === 1) { for (const x in m) if (m[x]===2) m[x]=1; m[c] = 2; } else delete m[c];
    if (!Object.keys(m).length) delete marks[openB.name];
    store.set("marks", marks); renderSheet(); return;
  }
});
function syncSort(){ document.querySelectorAll("[data-sort]").forEach(b => b.setAttribute("aria-pressed", b.dataset.sort===st.sort)); }
$("q").addEventListener("input", e => { st.q = e.target.value; st.letter = null; render(); });
$("clear").addEventListener("click", () => { $("q").value = ""; st.q = ""; render(); $("q").focus(); });
$("group").addEventListener("change", e => { st.group = e.target.value; st.letter = null; render(); });
$("favOnly").addEventListener("click", e => { st.fav = !st.fav; e.currentTarget.setAttribute("aria-pressed", st.fav); render(); });
$("shClose").addEventListener("click", closeSheet);
$("scrim").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape" && openB) closeSheet(); });
$("shFav").addEventListener("click", () => { const n=openB.name; favs.has(n)?favs.delete(n):favs.add(n); store.set("favs",[...favs]); renderSheet(); toast(favs.has(n)?"즐겨찾기에 추가했어요":"즐겨찾기에서 뺐어요"); });
$("shReset").addEventListener("click", () => { delete marks[openB.name]; store.set("marks", marks); renderSheet(); });
$("shCopy").addEventListener("click", () => {
  const t = `${openB.name}: ${openB.codes.join(", ")}`;
  const done = () => toast("코드를 복사했어요");
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, () => toast("복사가 막혀 있어요. 길게 눌러 직접 복사하세요"));
  else toast("복사가 막혀 있어요. 길게 눌러 직접 복사하세요");
});
syncSort(); render();
</script>
