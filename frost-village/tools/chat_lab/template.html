<title>서리마을 수다방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
/* Layout: one phone-width column — a snowy village notice board: world strip, resident cards, story log.
   Snowy day palette (light) / lantern-lit snowy night (dark). Jua for names and titles, system Korean sans for talk. */
:root {
  --snow: #e7eff8;
  --snow-deep: #d3e0ef;
  --paper: #fffaf0;
  --paper-2: #fde7bf;
  --rim: #efd3a0;
  --ink: #36415d;
  --ink-soft: #56617e;
  --accent: #f6a93b;
  --accent-ink: #3b2a10;
  --berry: #ef4f7f;
  --heart-empty: #c3cee0;
  --mint: #23806c;
  --mint-ink: #ffffff;
  --frost: #e4edf8;
  --flake: rgba(255, 255, 255, 0.9);
  --shade: rgba(40, 52, 84, 0.38);
  --shadow: rgba(58, 69, 98, 0.18);
  --focus: #2f7de1;
  --on-berry: #ffffff;
  --display: "Jua", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --body: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;

  --fc-paper: var(--paper); --fc-paper-2: var(--paper-2); --fc-rim: var(--rim); --fc-ink: var(--ink); --fc-ink-soft: var(--ink-soft);
  --fc-accent: var(--accent); --fc-accent-ink: var(--accent-ink); --fc-berry: var(--berry); --fc-heart-empty: var(--heart-empty);
  --fc-mint: var(--mint); --fc-mint-ink: var(--mint-ink); --fc-frost: var(--frost); --fc-shade: var(--shade); --fc-shadow: var(--shadow); --fc-focus: var(--focus);
  --fc-display: var(--display); --fc-body: var(--body);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --snow: #121a2c; --snow-deep: #0c1221; --paper: #232b42; --paper-2: #3d3550; --rim: #6b5a3c; --ink: #f1ead8; --ink-soft: #a9b0c6;
    --accent: #f3b04f; --accent-ink: #2a1c06; --berry: #ff7aa2; --heart-empty: #4a5677; --mint: #3fc0a3; --mint-ink: #0b2620; --frost: #2d3753;
    --flake: rgba(220, 232, 255, 0.55); --shade: rgba(0, 0, 0, 0.55); --shadow: rgba(0, 0, 0, 0.4); --focus: #8ab8ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --snow: #121a2c; --snow-deep: #0c1221; --paper: #232b42; --paper-2: #3d3550; --rim: #6b5a3c; --ink: #f1ead8; --ink-soft: #a9b0c6;
  --accent: #f3b04f; --accent-ink: #2a1c06; --berry: #ff7aa2; --heart-empty: #4a5677; --mint: #3fc0a3; --mint-ink: #0b2620; --frost: #2d3753;
  --flake: rgba(220, 232, 255, 0.55); --shade: rgba(0, 0, 0, 0.55); --shadow: rgba(0, 0, 0, 0.4); --focus: #8ab8ff;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--snow); }
body { margin: 0; color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
.lab { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 40px; display: flex; flex-direction: column; gap: 14px; position: relative; }
button { font-family: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* falling snow behind the header (decorative, stops for reduced motion) */
.sky { position: absolute; inset: 0 0 auto 0; height: 220px; pointer-events: none; overflow: hidden; z-index: 0;
  background-image: radial-gradient(2px 2px at 20px 30px, var(--flake) 50%, transparent 51%), radial-gradient(3px 3px at 120px 80px, var(--flake) 50%, transparent 51%),
  radial-gradient(2px 2px at 220px 20px, var(--flake) 50%, transparent 51%), radial-gradient(2.5px 2.5px at 300px 120px, var(--flake) 50%, transparent 51%),
  radial-gradient(2px 2px at 360px 60px, var(--flake) 50%, transparent 51%), radial-gradient(3px 3px at 80px 160px, var(--flake) 50%, transparent 51%);
  background-size: 400px 200px; animation: snowfall 14s linear infinite; opacity: .9; mask-image: linear-gradient(#000 40%, transparent); -webkit-mask-image: linear-gradient(#000 40%, transparent); }
@keyframes snowfall { from { background-position: 0 0; } to { background-position: 40px 200px; } }

.top { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 8px; padding-top: 6px; }
.brand h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1.1; letter-spacing: .01em; color: var(--ink); text-wrap: balance; }
.brand h1 .flake { display: inline-block; width: 26px; height: 26px; vertical-align: -3px; margin-right: 4px; }
.brand p { margin: 6px 0 0; font-size: 14px; color: var(--ink-soft); max-width: 34em; text-wrap: pretty; }
.modebar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--frost); color: var(--ink-soft); }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--heart-empty); }
.pill[data-mode="ai"] { background: var(--mint); color: var(--mint-ink); }
.pill[data-mode="ai"] .dot { background: var(--mint-ink); }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--ink); cursor: pointer; user-select: none; }
.switch input { appearance: none; -webkit-appearance: none; width: 42px; height: 24px; border-radius: 999px; background: var(--heart-empty); position: relative; margin: 0; cursor: pointer; transition: background .2s; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--paper); transition: transform .2s; }
.switch input:checked { background: var(--mint); }
.switch input:checked::after { transform: translateX(18px); }
.modehint { font-size: 12px; color: var(--ink-soft); }

/* the world strip: a little wooden notice */
.world { position: relative; z-index: 1; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; background: var(--paper); border: 3px solid var(--rim); border-radius: 20px; padding: 10px 12px; box-shadow: 0 3px 0 var(--shadow); }
.world .when-ic { width: 40px; height: 40px; grid-row: span 2; }
.world .when { font-family: var(--display); font-size: 18px; line-height: 1.2; color: var(--ink); }
.world .when small { font-family: var(--body); font-size: 13px; color: var(--ink-soft); font-weight: 700; margin-left: 4px; }
.world .news { grid-column: 2 / 3; margin: 0; font-size: 13px; color: var(--ink-soft); line-height: 1.4; min-width: 0; }
.world .news b { color: var(--ink); font-weight: 700; }
.btn { font: 700 14px var(--body); border: 0; border-radius: 999px; padding: 9px 14px; cursor: pointer; background: var(--accent); color: var(--accent-ink); box-shadow: 0 3px 0 var(--shadow); white-space: nowrap; }
.btn.ghost { background: var(--paper); color: var(--ink); border: 2px solid var(--rim); box-shadow: none; }
.world .btn { grid-row: span 2; align-self: center; }

.tabs { position: relative; z-index: 1; display: flex; gap: 6px; background: var(--frost); border-radius: 999px; padding: 4px; }
.tab { flex: 1; border: 0; background: none; border-radius: 999px; padding: 8px 10px; font: 700 14px var(--body); color: var(--ink-soft); cursor: pointer; display: inline-flex; justify-content: center; align-items: center; gap: 6px; }
.tab[aria-selected="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 2px 0 var(--shadow); }
.tab .n { font-size: 11.5px; min-width: 20px; padding: 0 6px; border-radius: 999px; background: var(--berry); color: var(--on-berry); line-height: 18px; font-variant-numeric: tabular-nums; }
.tab .n[data-zero] { background: var(--heart-empty); color: var(--ink); }

/* resident cards */
.people { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.card { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; background: var(--paper); border: 3px solid var(--rim); border-radius: 22px; padding: 12px 8px 10px; cursor: pointer; color: var(--ink); box-shadow: 0 3px 0 var(--shadow); min-width: 0; transition: transform .15s; }
.card:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--shadow); }
.card .ph { width: 72px; height: 72px; border-radius: 50%; background: var(--frost); border: 3px solid var(--rim); }
.card .mood { position: absolute; top: 8px; right: 10px; width: 30px; height: 30px; }
.card .nm { font-family: var(--display); font-size: 18px; line-height: 1.2; margin-top: 4px; }
.card .job { font-size: 12px; color: var(--ink-soft); line-height: 1.3; }
.hearts { display: inline-flex; gap: 1px; margin-top: 3px; }
.hearts i { width: 13px; height: 12px; color: var(--heart-empty); display: inline-block; }
.hearts i.on { color: var(--berry); }
.hearts i.half { color: var(--berry); opacity: .5; }
.hearts svg { width: 100%; height: 100%; display: block; }
.card .say { margin-top: 6px; font-size: 12.5px; line-height: 1.4; color: var(--ink); background: var(--frost); border-radius: 12px; padding: 6px 8px; width: 100%; min-height: 2.8em; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; word-break: keep-all; }
.card .badges { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; margin-top: 6px; }
.badge { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; color: var(--ink-soft); background: var(--frost); border-radius: 999px; padding: 1px 7px 1px 3px; }
.badge img { width: 16px; height: 16px; }
.card.fresh::after { content: "새 소문"; position: absolute; top: 8px; left: 10px; font-size: 10.5px; font-weight: 700; color: var(--on-berry); background: var(--berry); border-radius: 999px; padding: 1px 7px; }

/* story log */
.log { display: flex; flex-direction: column; gap: 10px; }
.logstats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--paper); border: 2px solid var(--rim); border-radius: 16px; padding: 8px 10px; }
.stat b { display: block; font-family: var(--display); font-weight: 400; font-size: 22px; line-height: 1.1; color: var(--ink); font-variant-numeric: tabular-nums; }
.stat span { font-size: 11.5px; color: var(--ink-soft); }
.loglead { margin: 0; font-size: 13px; color: var(--ink-soft); }
.filters { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.filters::-webkit-scrollbar { display: none; }
.fchip { flex: none; display: inline-flex; align-items: center; gap: 4px; font: 700 12.5px var(--body); border: 2px solid var(--rim); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 3px 10px 3px 4px; cursor: pointer; }
.fchip img { width: 22px; height: 22px; border-radius: 50%; }
.fchip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.fchip.all { padding-left: 10px; }
.entry { background: var(--paper); border: 2px solid var(--rim); border-radius: 18px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.entry .eh { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12.5px; color: var(--ink-soft); min-width: 0; }
.entry .eh .wholine { flex: 1 1 150px; min-width: 0; word-break: keep-all; }
.entry .eh img { width: 28px; height: 28px; border-radius: 50%; background: var(--frost); flex: none; }
.entry .eh .who { color: var(--ink); font-weight: 700; }
.entry .eh .tags { margin-left: auto; display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.tag { font-size: 11px; font-weight: 700; color: var(--ink-soft); background: var(--frost); border-radius: 999px; padding: 1px 7px; white-space: nowrap; }
.tag.ai { background: var(--mint); color: var(--mint-ink); }
.tag.new { background: var(--berry); color: var(--on-berry); }
.entry q { quotes: "“" "”"; font-size: 15px; line-height: 1.45; color: var(--ink); background: var(--frost); border-radius: 14px; padding: 8px 11px; word-break: keep-all; overflow-wrap: anywhere; }
.entry .kn { display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 1.45; color: var(--ink-soft); }
.entry .kn .kt { flex: 1 1 auto; min-width: 0; word-break: keep-all; }
.entry .faces { display: inline-flex; flex: none; }
.entry .faces img { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--paper); background: var(--frost); margin-left: -6px; }
.entry .faces img:first-child { margin-left: 0; }
.empty { text-align: center; background: var(--paper); border: 2px dashed var(--rim); border-radius: 18px; padding: 22px 16px; color: var(--ink-soft); font-size: 14px; }
.empty img { width: 56px; height: 56px; display: block; margin: 0 auto 6px; }

.foot { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--ink-soft); border-top: 2px dashed var(--rim); padding-top: 12px; }
.foot p { margin: 0; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* "소문이 퍼졌어요" moment */
.spread { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(calc(100% - 32px), 520px); z-index: 40; background: var(--paper); border: 3px solid var(--rim); border-radius: 22px; box-shadow: 0 10px 30px var(--shadow); padding: 10px 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; }
.spread.show { animation: pop-in .45s cubic-bezier(.2, 1.4, .4, 1); }
@keyframes pop-in { from { transform: translate(-50%, 30px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
.spread .pair { display: flex; align-items: center; gap: 2px; grid-row: span 2; }
.spread .pair img.p { width: 40px; height: 40px; border-radius: 50%; background: var(--frost); border: 2px solid var(--rim); }
.spread .pair .arrow { width: 28px; height: 28px; animation: hop 1.2s ease-in-out infinite; }
@keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.spread .t { font-family: var(--display); font-size: 15px; line-height: 1.3; color: var(--ink); }
.spread .q { font-size: 13px; color: var(--ink-soft); line-height: 1.4; grid-column: 2 / 3; }
.spread .x { grid-row: span 2; background: none; border: 0; color: var(--ink-soft); font-size: 22px; cursor: pointer; padding: 4px 6px; }

@media (max-width: 360px) { .people { gap: 8px; } .card .ph { width: 60px; height: 60px; } .brand h1 { font-size: 26px; } }
@media (prefers-reduced-motion: reduce) { .sky { animation: none; } .spread.show, .spread .pair .arrow { animation: none; } .card { transition: none; } }
</style>

<div class="lab" id="app">
  <div class="sky" aria-hidden="true"></div>
  <header class="top">
    <div class="brand">
      <h1><span class="flake" id="brand-ic" aria-hidden="true"></span>서리마을 수다방</h1>
      <p>주민을 눌러 직접 수다를 떨어 보세요. 나눈 이야기는 그 주민이 기억하고, 소문이 되어 다른 주민에게 퍼져요.</p>
    </div>
    <div class="modebar">
      <span class="pill" id="mode-pill" data-mode="offline"><span class="dot"></span><span id="mode-text">마을 말투로 대답해요</span></span>
      <label class="switch" id="ai-switch" hidden>AI로 대답 <input type="checkbox" id="ai-toggle" checked></label>
    </div>
    <p class="modehint" id="mode-hint">인터넷이 없어도 마을 말투로 수다를 떨 수 있어요.</p>
  </header>

  <section class="world" aria-label="오늘의 마을">
    <img class="when-ic" id="w-ic" alt="">
    <div class="when" id="w-when">1일째 아침 <small>눈</small></div>
    <p class="news" id="w-news"></p>
    <button class="btn" id="w-advance" type="button">시간 흐르기</button>
  </section>

  <div class="tabs" role="tablist" aria-label="보기">
    <button class="tab" role="tab" id="tab-people" aria-controls="view-people" aria-selected="true" type="button">주민</button>
    <button class="tab" role="tab" id="tab-log" aria-controls="view-log" aria-selected="false" type="button">마을 이야기 기록 <span class="n" id="log-n">0</span></button>
  </div>

  <section id="view-people" role="tabpanel" aria-labelledby="tab-people">
    <div class="people" id="people"></div>
  </section>

  <section id="view-log" role="tabpanel" aria-labelledby="tab-log" hidden>
    <div class="log">
      <div class="logstats" id="log-stats"></div>
      <p class="loglead">촌장님과의 수다에서 마을이 새로 배운 이야기예요. 미리 적어 둔 대사가 아니라, 수다를 떨 때마다 새로 생겨서 주민들 사이로 퍼져요.</p>
      <div class="filters" id="log-filters" role="toolbar" aria-label="주민별로 보기"></div>
      <div class="log" id="log-list"></div>
    </div>
  </section>

  <footer class="foot">
    <p>기록은 이 기기의 브라우저에만 저장돼요. 다른 사람에게는 보이지 않아요.</p>
    <div class="confirm" id="reset-box">
      <button class="btn ghost" id="reset" type="button">마을 처음부터 다시</button>
    </div>
  </footer>

  <div class="spread" id="spread" role="status" aria-live="polite" hidden></div>
</div>
<!--SCRIPT-->
